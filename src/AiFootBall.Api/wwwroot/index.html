function ratePill(name, hit, total){
  const rate = total > 0 ? Math.round(100 * hit / total) : 0;
  return `<span class="pill"><b>${name}</b> ${hit}/${total} <em class="${rate>=50?'hit-tag':'miss-tag'}">${wilsonText(hit, total)}</em></span>`;
}

function renderReviewDoc(md){
  const lines = String(md).replace(/\r/g,'').split('\n');
  const sections = [];
  let cur = { title: '', lines: [] };
  for(const line of lines){
    if(line.startsWith('## ')){
      sections.push(cur);
      cur = { title: line.slice(3), lines: [] };
    }else cur.lines.push(line);
  }
  sections.push(cur);
  const open = new Set(['总账','成功','失败','不改的','冷门参考','大小球（只作参考）']);
  let html = '';
  for(const sec of sections){
    const body = sec.title === '总账' ? reviewTally(sec.lines)
      : sec.title.startsWith('胜负彩') ? reviewSfcSection(sec.lines)
      : reviewLines(sec.lines);
    if(!sec.title){ html += body; continue; }
    html += `<details ${open.has(sec.title) ? 'open' : ''}><summary>${esc(sec.title)}</summary>${body}</details>`;
  }
  return html;
}
function reviewTally(lines){
  const tableLines = lines.filter(l => l.startsWith('|'));
  if(tableLines.length >= 2){
    const rest = lines.filter(l => !l.startsWith('|'));
    return markdownTable(tableLines) + reviewLines(rest);
  }
  const re = /^- (.+?) (\d+) 场，完场 (\d+)，有方向 (\d+) 中 (\d+)，页面会发布 (\d+) 中 (\d+)/;
  const rows = [];
  const rest = [];
  for(const line of lines){
    const m = line.match(re);
    if(!m){ if(line.trim()) rest.push(line); continue; }
    const n = Number(m[2]);
    if(!n) continue;
    rows.push({ name: m[1], n, done: Number(m[3]), aimed: Number(m[4]), hit: Number(m[5]), pub: Number(m[6]), pubHit: Number(m[7]) });
  }
  if(!rows.length) return reviewLines(lines);
  const allDone = rows.every(r => r.done === r.n);
  const rate = (hit, total) => total ? Math.round(100 * hit / total) + '%' : '—';
  const head = ['板块','场次'].concat(allDone ? [] : ['完场']).concat(['有方向','命中','命中率','会发布']);
  const body = rows.map(r => [r.name, r.n].concat(allDone ? [] : [r.done]).concat([
    r.aimed, r.hit, rate(r.hit, r.aimed), r.pub ? `${r.pub} 中 ${r.pubHit}` : '—'
  ]));
  return tallyHtml(head, body) + reviewLines(rest);
}
function markdownTable(lines){
  const rows = lines.map(l => l.split('|').slice(1, -1).map(c => c.trim()))
    .filter(cells => cells.length && !cells.every(c => /^:?-+:?$/.test(c)));
  if(rows.length < 2) return reviewLines(lines);
  return tallyHtml(rows[0], rows.slice(1));
}
function tallyHtml(head, body){
  const th = head.map((c, i) => `<th class="${i ? 'num' : ''}">${esc(c)}</th>`).join('');
  const tr = body.map(row => `<tr>${row.map((c, i) => `<td class="${i ? 'num' : ''}">${esc(c)}</td>`).join('')}</tr>`).join('');
  return `<div class="tally-wrap"><table class="tally"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>`;
}
function reviewSfcSection(lines){
  const issues = [];
  let current = null;
  let match = null;
  const preface = [];
  const flushMatch = () => {
    if(match && current) current.matches.push(match);
    match = null;
  };
  const ensure = (key) => {
    flushMatch();
    if(!current || current.key !== key){
      current = { key, extra: '', matches: [] };
      issues.push(current);
    }
  };
  for(const line of lines){
    const h3 = line.match(/^###\s+(.*)$/);
    const h4 = line.match(/^####\s+(.*)$/);
    const title = h3 ? h3[1] : h4 ? h4[1] : '';
    if(title){
      const issueOnly = title.match(/^(\d{4,6})(?:\s+(.*))?$/);
      const matchNo = title.match(/^(\d{4,6})-(\d+)\b/);
      if(h3 && issueOnly && !matchNo){
        flushMatch();
        ensure(issueOnly[1]);
        current.extra = issueOnly[2] || '';
        continue;
      }
      if(matchNo){
        ensure(matchNo[1]);
        flushMatch();
        match = { title, lines: [] };
        continue;
      }
    }
    if(!current) preface.push(line);
    else if(match) match.lines.push(line);
    else preface.push(line);
  }
  flushMatch();
  issues.sort((a, b) => {
    const opened = (issue) => {
      const head = (issue.extra || '').match(/(\d+)\s*场，完场\s*(\d+)/);
      if(head) return Number(head[1]) > 0 && Number(head[1]) === Number(head[2]);
      return issue.matches.length > 0 && issue.matches.every(m => {
        const verdict = (m.lines.find(l => l.startsWith('- 对照：')) || '').replace('- 对照：', '').trim();
        return verdict && verdict !== '未完场';
      });
    };
    const rank = (key) => { const n = parseInt(key, 10); return Number.isFinite(n) ? n : -1; };
    const byOpen = (opened(a) ? 1 : 0) - (opened(b) ? 1 : 0);
    if(byOpen) return byOpen;
    return rank(b.key) - rank(a.key);
  });
  let html = reviewLines(preface);
  for(const issue of issues){
    const brief = issue.extra || sfcIssueBrief(issue.matches);
    html += `<details class="issue"><summary>第 ${esc(issue.key)} 期${brief ? ' · ' + esc(brief) : ''}</summary>`;
    for(const m of issue.matches){
      html += `<h4>${esc(m.title)}</h4>${reviewLines(m.lines)}`;
    }
    html += '</details>';
  }
  return html;
}
function sfcIssueBrief(matches){
  let done = 0, aimed = 0, hit = 0;
  for(const m of matches){
    const verdict = (m.lines.find(l => l.startsWith('- 对照：')) || '').replace('- 对照：', '').trim();
    if(!verdict || verdict === '未完场') continue;
    done++;
    if(verdict === '命中' || verdict === '未中') aimed++;
    if(verdict === '命中') hit++;
  }
  return `${matches.length} 场，完场 ${done}，有方向 ${aimed} 中 ${hit}`;
}
function reviewLines(lines){
  let html = '';
  let list = false;
  const close = () => { if(list){ html += '</ul>'; list = false; } };
  for(const line of lines){
    if(line.startsWith('# ')){ close(); html += `<h2>${esc(line.slice(2))}</h2>`; }
    else if(line.startsWith('### ')){ close(); html += `<h4>${esc(line.slice(4))}</h4>`; }
    else if(line.startsWith('- ') || line.startsWith('  - ')){
      if(!list){ html += '<ul>'; list = true; }
      const sub = line.startsWith('  ');
      html += `<li${sub ? ' class="sub"' : ''}>${esc(line.replace(/^\s*-\s/,''))}</li>`;
    }else if(!line.trim()) close();
    else { close(); html += `<p>${esc(line)}</p>`; }
  }
  close();
  return html;
}

function renderSummary(d){
  let html = '';
  const nextOff = d.date >= localYmd(new Date());
  const finished = (d.items || []).length;
  html += `<div class="page-head">
    <div class="date-nav">
      <button type="button" id="sumPrev">前一天</button>
      <span class="date-val">${d.date}</span>
      <button type="button" id="sumNext" ${nextOff?'disabled':''}>后一天</button>
    </div>
    <span class="meta">${finished ? '库里已完场 ' + finished + ' 场' : '每天 08:20 写前一天'}</span>
  </div>`;

  if(finished > 0){
  const win = d.hitRate >= 50;
  const b = d.boughtStat || {total:0,hit:0,hitRate:0};
  const h = d.highStat || {total:0,hit:0,hitRate:0};
  const bWin = b.hitRate >= 50;
  const hWin = h.hitRate >= 50;
  html += `<div class="bet-stats">
    <div class="stat-card"><div class="s-label">计入命中率</div><div class="s-val ${win?'win':'lose'}">${d.hitRate}%</div><div class="s-sub">置信≥60% · ${d.total} 场 · 中 ${d.hit}${d.hitLow!=null ? ` · 区间 ${d.hitLow}%–${d.hitHigh}%` : ''}</div></div>
    <div class="stat-card"><div class="s-label">实购</div><div class="s-val ${b.total? (bWin?'win':'lose') : ''}">${b.total ? b.hitRate+'%' : '—'}</div><div class="s-sub">${b.hit}/${b.total} 场</div></div>
    <div class="stat-card"><div class="s-label">高置信</div><div class="s-val ${h.total? (hWin?'win':'lose') : ''}">${h.total ? h.hitRate+'%' : '—'}</div><div class="s-sub">≥70% · ${h.hit}/${h.total}</div></div>
  </div>`;

  const pills = [];
  for(const q of d.byQuality || []) pills.push(ratePill(q.name, q.hit, q.total));
  for(const r of d.byResult || []) pills.push(ratePill(r.name, r.hit, r.total));
  if(pills.length) html += `<div class="pill-row">${pills.join('')}</div>`;
  const leagues = (d.byLeague || []).map(l => ratePill(l.league, l.hit, l.total));
  if(leagues.length) html += `<details class="league-fold"><summary>按赛事（${leagues.length}）</summary><div class="pill-row">${leagues.join('')}</div></details>`;
  }

  if(d.document) html += `<div class="review-doc">${renderReviewDoc(d.document)}</div>`;

  // 每场复盘明细：实购场次置顶，其余按比赛时间
  if(!d.items || d.items.length === 0){
    if(!d.document) html += `<div class="empty">${d.date} 的复盘还没写。每天 08:20 写前一天。</div>`;
  } else {
    const sorted = [...d.items].sort((a,b)=>{
      if(a.isBought && !b.isBought) return -1;
      if(!a.isBought && b.isBought) return 1;
      return new Date(a.matchTime) - new Date(b.matchTime);
    });
    for(const it of sorted){
      html += renderSummaryItem(it);
    }
  }

  $('#summary').innerHTML = html;
  $('#sumPrev').onclick = () => { summaryDate = shiftYmd(summaryDate, -1); loadSummary(); };
  const next = $('#sumNext');
  if(next && !next.disabled) next.onclick = () => { summaryDate = shiftYmd(summaryDate, 1); loadSummary(); };
}

function oddsPrice(notes, label){
  if(!notes || !label) return '';
  const row = notes.find(x => String(x).split('：')[0] === label);
  return row ? String(row).split('：').slice(1).join('：') : '';
}
function oddsNoteHit(note, it){
  const label = String(note).split('：')[0];
  const full = `${it.fullHome}:${it.fullAway}`;
  if(label.startsWith('最终比分')) return true;
  if(label.startsWith('比分 ')) return label.slice(3).trim() === full;
  if(label.includes('/')) return label === it.halfFull;
  return !!it.hit && label === it.recResultText;
}
function pickMark(hasPick, hit){
  if(!hasPick) return '';
  return hit ? '<span class="hit-tag">命中</span>' : '<span class="miss-tag">未中</span>';
}

function renderSummaryItem(it){
  const tm = it.matchTime ? new Date(it.matchTime).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
  const full = `${it.fullHome}:${it.fullAway}`;
  const half = it.halfHome!=null ? `半场 ${it.halfHome}:${it.halfAway}` : '';
  const cover = it.isCoverAll || !it.recResult;
  const bought = it.boughtOptions && it.boughtOptions.length
    ? it.boughtOptions.map(o=>`<span class="opt-tag">${o}</span>`).join('') : '';
  const confVal = it.confidence==null ? '' : Math.round(it.confidence) + '%';
  const statusClass = cover ? 'st-WAIT' : (it.hit ? 'st-WON' : 'st-LOST');
  const statusText = cover ? '全包' : (it.hit ? '命中' : '未中');
  const scores = [it.recScore1, it.recScore2].filter(Boolean);
  const goalPicks = [it.recGoals1, it.recGoals2].filter(g => g!=null);
  const scoreHit = scores.some(s => s === full);
  const goalHit = goalPicks.some(g => g === it.totalGoals);
  const spfPrice = cover ? '' : oddsPrice(it.oddsNotes, it.recResultText);
  const spfNum = spfPrice ? ` <b class="${it.hit?'hit':''}">${esc(spfPrice)}</b>` : '';
  const bits = [`胜平负 <b>${it.recResultText}</b>${spfNum} → ${it.actualResultText}`];
  if(confVal) bits.push(confVal);
  if(scores.length) bits.push(`比分 ${scores.join('、')} ${pickMark(true, scoreHit)}`);
  if(goalPicks.length) bits.push(`进球 ${goalPicks.join('、')} ${pickMark(true, goalHit)}`);
  if(it.recHandicapText && it.recHandicapText !== '—'){
    const hcpMark = it.handicapHit == null ? '' : (it.handicapHit ? '<span class="hit-tag">命中</span>' : '<span class="miss-tag">未中</span>');
    bits.push(`让球推荐 ${it.recHandicapText} ${hcpMark}`);
  }
  if(it.recHalfFull) bits.push(`半全场推荐 ${it.recHalfFull}`);
  if(it.halfFull){
    const hfPrice = oddsPrice(it.oddsNotes, it.halfFull);
    const hfNum = hfPrice ? ` <b class="hit">${esc(hfPrice)}</b>` : '';
    bits.push(`半全场 ${it.halfFull}${hfNum}`);
  }

  return `<article class="rev ${it.isBought?'is-bought':''}">
    <div>
      <div class="rev-top">
        <span class="badge badge-${it.board}">${BOARD_TEXT[it.board]||it.board}</span>
        <span class="match-no">${it.matchNo||''}</span>
        ${it.isBought ? '<span class="bought-tag">已实购</span>' : ''}
        ${it.confidence!=null && it.confidence<60 ? '<span class="lowconf-tag">低置信</span>' : ''}
        <span class="b-meta">${it.leagueName||''}</span>
        <span class="b-meta">${tm}</span>
      </div>
      <div class="rev-teams">${it.homeTeam} <span class="vs">VS</span> ${it.awayTeam}</div>
      <div class="rev-bits">${bits.join(' · ')}</div>
      ${(it.oddsNotes && it.oddsNotes.length) ? `<div class="rev-odds">赔率 ${it.oddsNotes.map(x => `<b class="${oddsNoteHit(x, it)?'hit':''}">${esc(x)}</b>`).join(' · ')}</div>` : ''}
      ${bought ? `<div class="rev-bits">购买 ${bought}</div>` : ''}
    </div>
    <div class="rev-side">
      <div class="rev-score">${full}</div>
      <div class="rev-half">${half}</div>
      <span class="b-status ${statusClass}">${statusText}</span>
    </div>
    ${it.analysis ? `<details class="rev-note"><summary>推荐思路</summary><p>${it.analysis}</p></details>` : ''}
  </article>`;
}

/* ============ 历史推荐查询 ============ */

const SPF_TEXT = {'3':'胜','1':'平','0':'负'};
function fmtDateTime(t){
  if(!t) return '';
  return new Date(t).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

let historyDate = '';
let _historyData = null;

async function loadHistory(){
  const box = $('#history');
  box.innerHTML = '<div class="empty">加载中…</div>';
  try{
    _historyData = await api('/api/recommend/list?take=2000');
    renderHistory();
  }catch(e){ box.innerHTML = '<div class="empty">加载失败：' + e.message + '</div>'; }
}

function renderHistory(){
  const box = $('#history');
  const d = _historyData;
  const source = (d && d.items) || [];
  const shown = historyDate
    ? source.filter(it => (it.matchTime || it.recDate || '').slice(0,10) === historyDate)
    : source;
  if(source.length === 0){
    box.innerHTML = `<div class="page-head">${dateQueryHtml('his', historyDate, true)}</div><div class="empty">暂无历史推荐记录</div>`;
    bindDateQuery('his', () => historyDate, v => { historyDate = v; }, renderHistory);
    return;
  }

  // 按比赛日期分组（降序），日期内按板块 竞彩/北单/胜负彩 分组
  const byDate = new Map();
  for(const it of shown){
    const day = (it.matchTime || '').slice(0,10) || '日期未知';
    if(!byDate.has(day)) byDate.set(day, []);
    byDate.get(day).push(it);
  }

  // 日期降序排序
  const days = [...byDate.keys()].sort((a,b) => (a < b ? 1 : a > b ? -1 : 0));

  const BOARD_ORDER = ['jc','bd','sfc'];
  const meta = historyDate
    ? `${historyDate} · ${shown.length} 场`
    : `共 ${d.total} 场 · 按比赛日期 → 板块分组`;
  let html = `<div class="page-head">${dateQueryHtml('his', historyDate, true)}<span class="meta">${meta}</span></div>`;
  if(shown.length === 0){
    html += `<div class="empty">${historyDate} 没有推荐记录</div>`;
    box.innerHTML = html;
    bindDateQuery('his', () => historyDate, v => { historyDate = v; }, renderHistory);
    return;
  }

  for(const day of days){
    const items = byDate.get(day);
    // 板块分组，保持 BOARD_ORDER 顺序
    const boards = {};
    for(const it of items){
      const b = BOARD_ORDER.includes(it.board) ? it.board : 'other';
      (boards[b] = boards[b] || []).push(it);
    }

    html += `<div class="history-day">
      <div class="history-day-title">${day}</div>`;

    for(const b of BOARD_ORDER){
      const list = boards[b];
      if(!list || list.length === 0) continue;
      // 竞彩/北单按官方场次号；胜负彩同样按场次号
      list.sort(officialMatchSort);
      const bt = BOARD_TEXT[b] || b;
      const rows = list.map(it => {
        const rr = it.isCoverAll || !it.recResult ? '全包' : (SPF_TEXT[it.recResult] || it.recResult);
        const t = fmtDateTime(it.createdAt);
        const mt = it.matchTime ? fmtDateTime(it.matchTime) : '';
        return `<tr>
          <td class="mono">${mt}</td>
          <td class="mono">${it.matchNo || '—'}</td>
          <td>${it.homeTeam || ''} <span class="vs">vs</span> ${it.awayTeam || ''}</td>
          <td>${rr}</td>
          <td class="mono">${it.confidence != null ? it.confidence.toFixed(1) + '%' : '—'}</td>
          <td class="signal-clip" title="${(it.signalDesc || '').replace(/"/g,'&quot;')}">${it.signalDesc || ''}</td>
        </tr>`;
      }).join('');
      html += `<div class="history-board">
        <div class="history-board-title">${bt} <span class="cnt">${list.length} 场</span></div>
        <div class="tbl"><table>
          <thead><tr><th>比赛时间</th><th>场次</th><th>对阵</th><th>推荐</th><th>置信度</th><th>信号依据</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
      </div>`;
    }

    html += `</div>`;
  }

  box.innerHTML = html;
  bindDateQuery('his', () => historyDate, v => { historyDate = v; }, renderHistory);
}

/* ============ 复盘查询 ============ */

let reviewDate = '';
let _reviewData = null;

async function loadReview(){
  const box = $('#review');
  box.innerHTML = '<div class="empty">加载中…</div>';
  try{
    _reviewData = await api('/api/review/list?take=1000');
    renderReview();
  }catch(e){ box.innerHTML = '<div class="empty">加载失败：' + e.message + '</div>'; }
}

function reviewCounts(it){
  const dir = !it.isCoverAll && (it.recResult === '3' || it.recResult === '1' || it.recResult === '0');
  return dir && it.confidence != null && Number(it.confidence) >= 60;
}

function renderReview(){
  const box = $('#review');
  const d = _reviewData;
  const source = (d && d.items) || [];
  const items = reviewDate
    ? source.filter(it => (it.matchTime || '').slice(0,10) === reviewDate)
    : source;
  if(source.length === 0){
    box.innerHTML = `<div class="page-head">${dateQueryHtml('rev', reviewDate, true)}</div><div class="empty">暂无已复盘的记录</div>`;
    bindDateQuery('rev', () => reviewDate, v => { reviewDate = v; }, renderReview);
    return;
  }
  const order = ['jc','bd','sfc'];
  const groups = {jc:[], bd:[], sfc:[]};
  for(const it of items){
    if(groups[it.board]) groups[it.board].push(it);
  }
  const rowHtml = it => {
    const rr = it.isCoverAll || !it.recResult ? '全包' : (SPF_TEXT[it.recResult] || it.recResult);
    const ar = it.actualResult ? (SPF_TEXT[it.actualResult] || it.actualResult) : '—';
    const mt = it.matchTime ? fmtDateTime(it.matchTime) : '';
    const counted = reviewCounts(it);
    const hit = !counted
      ? '<span class="dim">不计入</span>'
      : it.hit === true ? '<span class="hit-tag">命中</span>' : it.hit === false ? '<span class="miss-tag">未中</span>' : '<span class="dim">待定</span>';
    return `<tr>
      <td class="mono">${mt}</td>
      <td class="mono">${it.matchNo || '—'}</td>
      <td>${it.leagueName || ''}</td>
      <td>${it.homeTeam || ''} <span class="vs">vs</span> ${it.awayTeam || ''}</td>
      <td>${rr}</td>
      <td>${ar}</td>
      <td class="mono">${it.actualScore || '—'}</td>
      <td class="mono">${it.actualGoals != null ? it.actualGoals : '—'}</td>
      <td>${hit}</td>
    </tr>`;
  };
  const sections = order.map(b => {
    const list = groups[b];
    const scored = list.filter(reviewCounts);
    const hitN = scored.filter(it => it.hit === true).length;
    const rate = scored.length ? wilsonText(hitN, scored.length) : null;
    return { b, list, scored: scored.length, hitN, rate };
  });
  const allScored = sections.reduce((n, s) => n + s.scored, 0);
  const allHit = sections.reduce((n, s) => n + s.hitN, 0);
  const allRate = allScored ? wilsonText(allHit, allScored) : '0%';
  const headMeta = items.length === 0
    ? `${reviewDate} 没有已复盘的场次`
    : `计入统计 ${allScored} 场 · 命中 ${allHit} 场 · ${allRate}`;
  let html = `<div class="page-head">${dateQueryHtml('rev', reviewDate, true)}<span class="meta">${headMeta}</span></div>`;
  if(items.length === 0){
    box.innerHTML = html + `<div class="empty">${reviewDate} 没有已复盘的场次</div>`;
    bindDateQuery('rev', () => reviewDate, v => { reviewDate = v; }, renderReview);
    return;
  }
  for(const s of sections){
    const { b, list, hitN, rate } = s;
    const meta = list.length === 0
      ? '暂无已复盘记录'
      : `共 ${list.length} 场 · 计入统计 ${s.scored} 场 · 命中 ${hitN} 场 · ${rate == null ? '—' : rate}`;
    const body = list.length
      ? `<div class="board-scroll"><table class="tbl">
          <thead><tr><th>比赛时间</th><th>场次</th><th>赛事</th><th>对阵</th><th>推荐</th><th>实际</th><th>比分</th><th>进球</th><th>结果</th></tr></thead>
          <tbody>${list.map(rowHtml).join('')}</tbody>
        </table></div>`
      : '<div class="empty">暂无已复盘记录</div>';
    html += `<div class="board">
      <div class="board-head"><span class="badge badge-${b}">${BOARD_TEXT[b]}</span><span class="meta">${meta}</span></div>
      ${body}
    </div>`;
  }
  box.innerHTML = html;
  bindDateQuery('rev', () => reviewDate, v => { reviewDate = v; }, renderReview);
}

  showMain();
  api('/api/auth/me').then(d=>{ $('#nickName').textContent = d.nickName || d.userName; }).catch(()=>{});
  loadRecommendations();
} else { showLogin(); }
