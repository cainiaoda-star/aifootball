  // 现在这块区域只有大奶：榜 + 今日票 + 战绩。
  $('#boards').innerHTML = _boards
      .map(b => (b.milkPicks ? renderMilkBoard(b, strongOnly) : renderBoard(b, strongOnly)))
      .join('')
    + `<div class="dim" style="margin:10px 2px">胜平负 / 让球 / 大小球自 2026-11-04 起停止发布。后台仍按旧口径计算并落库（校准与否决台账要用），但不再对外给任何方向。</div>`;
  bindPickCheckboxes();
  bindSfcBits();
  bindMilkPicks();
  renderBetPickBar();
  loadWater();
  loadJcWater();
  loadMilkRecord();
}

/* ---------- 大奶战绩（FbMilkPick 台账） ---------- */

async function loadMilkRecord(days){
  const box = $('#milkRecord');
  if(!box) return;
  const span = days || 30;
  try{
    const r = await api(`/api/milk/pick-stats?days=${span}`);
    box.innerHTML = milkRecordHtml(r);
    box.querySelectorAll('[data-milk-days]').forEach(btn => {
      btn.onclick = (ev) => {
        ev.stopPropagation();
        loadMilkRecord(Number(btn.getAttribute('data-milk-days')));
      };
    });
    const head = box.querySelector('[data-milk-record-toggle]');
    if(head){
      head.onclick = () => {
        const body = box.querySelector('.milk-record-body');
        const arrow = head.querySelector('.milk-fold-arrow');
        if(!body) return;
        const collapsed = body.style.display === 'none';
        body.style.display = collapsed ? '' : 'none';
        if(arrow) arrow.textContent = collapsed ? '▾' : '▸';
      };
    }
  }catch(e){
    box.innerHTML = `<div class="dim">大奶战绩取不到：${esc(e && e.message ? e.message : String(e))}</div>`;
  }
}

function milkRecordHtml(r){
  const o = r.overall || {};
  const picked = Number(o.total || 0);
  const hits = Number(o.hit || 0);
  const roi = Number(o.roi || 0);
  const btn = d => `<button type="button" class="btn-mini" data-milk-days="${d}">近${d}天</button>`;

  let html = `<div class="milk-head" data-milk-record-toggle>
    <h3>大奶战绩 <span class="milk-fold-arrow">▸</span></h3>
    <span class="dim">近 ${esc(String(r.days || 30))} 天 · 已结算 <b>${picked}</b> 注 · 命中 <b class="hit-tag">${hits}</b> 注 ·
      命中率 <b>${Number(o.hitRatePct || 0).toFixed(1)}%</b> · 平注 ROI <b class="${roi >= 1 ? 'hit-tag' : 'miss-tag'}">${roi.toFixed(2)}</b>
      ${r.pending ? ` · 待结算 ${r.pending} 注` : ''}</span>
    <span class="milk-tags">${btn(30)}${btn(90)}</span>
  </div>`;

  html += `<div class="milk-record-body" style="display:none">`;

  if(!picked){
    html += `<p class="milk-note">还没有已结算的大奶注。台账从 2026-11-04 开始记，等今晚赛果落库后这里才会有数。</p>`;
    html += `</div>`;
    return html;
  }

  html += `<div class="board-scroll"><table class="tbl rec-tbl"><thead><tr>
      <th>玩法</th><th>已结算</th><th>命中</th><th>命中率</th><th>平均赔率</th><th>平注 ROI</th><th>模型给的概率</th><th>高估</th>
    </tr></thead><tbody>`;
  const name = { BF: '比分', BQ: '半全场', JQ: '总进球' };
  for(const p of (r.plays || [])){
    const pr = Number(p.roi || 0);
    const over = Number(p.overconfidencePct || 0);
    html += `<tr>
      <td>${esc(name[p.playType] || p.playType || '')}</td>
      <td class="mono">${p.total}</td>
      <td class="mono">${p.hit}</td>
      <td class="mono"><b>${Number(p.hitRatePct || 0).toFixed(1)}%</b></td>
      <td class="mono">${Number(p.avgOdds || 0).toFixed(2)}</td>
      <td class="mono"><b class="${pr >= 1 ? 'hit-tag' : 'miss-tag'}">${pr.toFixed(2)}</b></td>
      <td class="mono">${Number(p.avgProbability || 0).toFixed(1)}%</td>
      <td class="mono"><span class="${over > 0 ? 'miss-tag' : 'hit-tag'}">${over > 0 ? '+' : ''}${over.toFixed(1)}pt</span></td>
    </tr>`;
  }
  html += `</tbody></table></div>`;

  if((r.topOptions || []).length){
    html += `<h4 class="ref-note">高频选项（≥3 注才列，按注数排）</h4>
      <div class="board-scroll"><table class="tbl rec-tbl"><thead><tr>
        <th>选项</th><th>注数</th><th>命中</th><th>命中率</th><th>平均赔率</th>
      </tr></thead><tbody>`;
    for(const t of r.topOptions){
      html += `<tr>
        <td>${esc((name[t.playType] || t.playType || '') + ' ' + (t.optionName || t.optionCode || ''))}</td>
        <td class="mono">${t.total}</td>
        <td class="mono">${t.hit}</td>
        <td class="mono">${Number(t.hitRatePct || 0).toFixed(1)}%</td>
        <td class="mono">${Number(t.avgOdds || 0).toFixed(2)}</td>
      </tr>`;
    }
    html += `</tbody></table></div>`;
  }

  html += `<p class="milk-note">平注 ROI = 每注 1 元、命中按赔率返还的口径；「高估」= 模型平均概率 − 实际命中率，正数说明模型把这一档算乐观了。样本少于 30 注时波动很大，别急着改参数。</p>`;
  html += `</div>`;
  return html;
}

/* ---------- 竞彩大奶榜（2026-11-04 改向：比分/半全场/总进球） ---------- */

const MILK_PLAY_ORDER = { BF: 0, BQ: 1, JQ: 2 };
const MILK_PLAY_NAME = { BF: '比分', BQ: '半全场', JQ: '总进球' };
// 竞彩各玩法的固定返奖率 = 1/水位（2026-11-05 实测同批次 13 场，逐场水位一致到小数点后三位）。
// 这是这条玩法「每投 100 元长期能收回多少」的天花板，也是 EV 的理论上限——EV 永远到不了 1。
const MILK_PAYOUT = { BF: 0.709, BQ: 0.797, JQ: 0.797, SPF: 0.878, NSPF: 0.878 };

/* 大奶榜勾选 → 投注单
   勾的是「注」不是「场」：同一场可能同时有比分、半全场、总进球三注，
   每一注的选项和赔率都不一样，按场勾会把玩法搞混。
   勾完把整批带进「我的投注」表单，用户核赔率后保存。 */
let _milkPickSet = new Set();     // key = matchId|playType|optionCode
let _milkPickData = new Map();    // key → 完整注（含 odds/option/matchNo）
let _milkFillRest = [];           // 竞彩一张票只能一个玩法，多玩法时剩下的组
// 过关方式默认 2/3/4/5 串 1 全勾。场次不够的串法填单时自动忽略（2 场不会出现 4串1）。
let _milkPass = new Set(['2串1', '3串1', '4串1', '5串1']);
const MILK_PASS_ALL = ['2串1', '3串1', '4串1', '5串1'];

function milkPickKey(it){
  return `${it.matchId != null ? it.matchId : it.matchNo}|${it.playType}|${it.optionCode}`;
}
function milkPlayCn(p){ return MILK_PLAY_NAME[p] || p || ''; }
// 票面类型：比分走 jc-score；半全场/总进球各有一档（OCR 端暂未收录这两种预设，
// 会退回通用识别 auto，比强行按比分解析更准）。保存只认玩法字段，不受影响。
function milkTicketKindOf(play){
  return play === 'BF' ? 'jc-score' : play === 'BQ' ? 'jc-half' : play === 'JQ' ? 'jc-total' : 'jc-spf';
}

/** 勾选按玩法分组（一张竞彩票只能一个玩法） */
function milkGroups(){
  const g = {};
  for(const k of _milkPickSet){
    const it = _milkPickData.get(k);
    if(it) (g[it.playType] = g[it.playType] || []).push(it);
  }
  return Object.keys(g)
    .sort((a, b) => (MILK_PLAY_ORDER[a] ?? 9) - (MILK_PLAY_ORDER[b] ?? 9))
    .map(p => ({ play: p, items: g[p] }));
}

/** 组内去重场次数（同场同玩法最多 2 注，会并成一行） */
function groupMatchCount(items){
  const s = new Set();
  for(const it of items) s.add(it.matchNo || String(it.matchId ?? ''));
  return s.size;
}

/** 该组实际能用的过关方式：只留勾上的、且场次够的。返回 '2串1#3串1' 这种字符串。 */
function milkPassOf(matchCount){
  return MILK_PASS_ALL
    .filter(p => _milkPass.has(p) && parseInt(p, 10) <= matchCount)
    .join('#');
}

/** 从 counts 里取 m 场，各场选项数相乘后累加（复式注数） */
function sumComboBets(counts, m){
  let sum = 0;
  const rec = (start, depth, prod) => {
    if(depth === m){ sum += prod; return; }
    for(let i = start; i <= counts.length - (m - depth); i++) rec(i + 1, depth + 1, prod * counts[i]);
  };
  rec(0, 0, 1);
  return sum;
}

/** 这一组打多少注：串关＝各组合乘积之和；一档串法都没勾＝单关，勾几注算几注 */
function milkGroupBetCount(items){
  const byNo = new Map();
  for(const it of items){
    const k = it.matchNo || String(it.matchId ?? '');
    byNo.set(k, (byNo.get(k) || 0) + 1);
  }
  const counts = [...byNo.values()];
  const pass = milkPassOf(counts.length);
  if(!pass) return items.length;
  let total = 0;
  for(const p of pass.split('#')){
    const m = parseInt(p, 10);
    if(m >= 2) total += sumComboBets(counts, m);
  }
  return total;
}

/** 勾选变化后只更新工具条与行高亮，不重渲染整张榜 */
function updateMilkPickBar(){
  const bar = document.querySelector('#milkPickBar');
  if(!bar) return;
  const groups = milkGroups();
  const picks = groups.reduce((s, g) => s + g.items.length, 0);
  const detail = groups.map(g => `${milkPlayCn(g.play)} ${g.items.length}`).join(' · ');
  // 串关注数按组算（一张票一个玩法），组内场次不够的串法自动跳过
  let bets = 0;
  for(const g of groups) bets += milkGroupBetCount(g.items);
  const cnt = bar.querySelector('.mk-count');
  if(cnt){
    if(!picks){
      cnt.innerHTML = '勾选要买的注，或点「全选」把今天的大奶全带上';
    } else {
      // 多组时各组场次数不同，过关档位也不同，别拿第一组冒充全部
      const passTxt = groups.length === 1
        ? (milkPassOf(groupMatchCount(groups[0].items)) || '单关')
        : '各组按场次自动';
      const multi = groups.length > 1 ? ` · 拆 ${groups.length} 张票（${esc(detail)}）` : '';
      cnt.innerHTML = `已选 <b>${picks}</b> 注${multi} · 过关 <b>${esc(passTxt)}</b>`
        + ` · 打 <b>${bets}</b> 注 / <b>${bets * 2}</b> 元`;
    }
  }
  const fill = bar.querySelector('[data-milk-fill]');
  if(fill){
    fill.disabled = picks === 0;
    fill.textContent = picks ? `把 ${picks} 注填入投注单` : '填入投注单';
  }
}

function bindMilkPicks(){
  document.querySelectorAll('input.milk-pick').forEach(inp => {
    inp.onchange = () => {
      const key = inp.getAttribute('data-mk');
      const line = inp.closest('.opt-line');
      if(inp.checked){ _milkPickSet.add(key); if(line) line.classList.add('mk-on'); }
      else { _milkPickSet.delete(key); if(line) line.classList.remove('mk-on'); }
      updateMilkPickBar();
    };
  });
  const syncAll = on => {
    document.querySelectorAll('input.milk-pick').forEach(inp => {
      inp.checked = on;
      const key = inp.getAttribute('data-mk');
      const line = inp.closest('.opt-line');
      if(on){ _milkPickSet.add(key); if(line) line.classList.add('mk-on'); }
      else { _milkPickSet.delete(key); if(line) line.classList.remove('mk-on'); }
    });
    updateMilkPickBar();
  };
  const all = document.querySelector('[data-milk-all]');
  if(all) all.onclick = () => syncAll(true);
  const none = document.querySelector('[data-milk-none]');
  if(none) none.onclick = () => syncAll(false);
  document.querySelectorAll('input[data-mkpass]').forEach(inp => {
    inp.onchange = () => {
      const p = inp.getAttribute('data-mkpass');
      const label = inp.closest('label');
      if(inp.checked){ _milkPass.add(p); if(label) label.classList.add('on'); }
      else { _milkPass.delete(p); if(label) label.classList.remove('on'); }
      updateMilkPickBar();
    };
  });
  const fill = document.querySelector('[data-milk-fill]');
  if(fill) fill.onclick = goBetFromMilk;
  const next = document.querySelector('#milkFillNextBtn');
  if(next) next.onclick = () => {
    const group = _milkFillRest[0];
    if(!group) return;
    fillBetGroup(group, _milkFillRest.slice(1));
  };
  updateMilkPickBar();
}

/** 勾选的注按玩法分组。竞彩一张票只能一个玩法，所以多玩法要分几组填。 */
function goBetFromMilk(){
  const items = [];
  for(const k of _milkPickSet){
    const it = _milkPickData.get(k);
    if(it) items.push(it);
  }
  if(!items.length){ alert('先勾选要买的注'); return; }
  const groups = {};
  for(const it of items) (groups[it.playType] = groups[it.playType] || []).push(it);
  const queue = Object.keys(groups)
    .sort((a, b) => (MILK_PLAY_ORDER[a] ?? 9) - (MILK_PLAY_ORDER[b] ?? 9))
    .map(p => ({ play: p, items: groups[p].slice().sort(officialMatchSort) }));
  fillBetGroup(queue[0], queue.slice(1));
}

/** 把一组（同一玩法）的注填进「我的投注」表单，剩余组存起来等用户继续 */
function fillBetGroup(group, rest){
  if(!group || !group.items.length) return;
  _milkFillRest = rest || [];
  // 同一场同玩法最多 2 注（引擎侧已限），正好落进 选项1/选项2 两格。
  const byNo = new Map();
  for(const it of group.items){
    const k = it.matchNo || '';
    let g = byNo.get(k);
    if(!g){
      g = { matchNo: it.matchNo, home: it.homeTeam, away: it.awayTeam, opts: [] };
      byNo.set(k, g);
    }
    g.opts.push({ option: it.option || '', odds: it.odds });
  }
  const lines = [];
  for(const g of byNo.values()){
    const a = g.opts[0] || {};
    const b = g.opts[1] || {};
    lines.push({
      matchNo: g.matchNo, home: g.home, away: g.away, handicap: '',
      option1: a.option || '', odds1: a.odds != null ? a.odds : '',
      option2: b.option || '', odds2: b.odds != null ? b.odds : ''
    });
  }
  const betCount = milkGroupBetCount(group.items);
  const passType = milkPassOf(byNo.size);
  _pendingBetFill = {
    board: 'jc',
    playType: milkPlayCn(group.play),
    ticketKind: milkTicketKindOf(group.play),
    // 过关按工具条上勾的档位走（默认 2/3/4/5 串 1 全勾，场次不够的自动剔掉）。
    // 一档都没勾就是单关——大奶靠命中率，串得越少中得越勤，别默认全串。
    passType,
    multiple: 1,
    betCount,
    betAmount: betCount * 2,
    lines,
    milkRest: _milkFillRest
  };
  switchTab('mybets');
}

/** 还有几组没填时的提示条（挂在录入表单上方） */
function renderMilkFillRest(rest){
  const old = document.querySelector('#milkFillNext');
  if(old) old.remove();
  if(!rest || !rest.length) return;
  const total = rest.reduce((s, g) => s + g.items.length, 0);
  const txt = rest.map(g => `${milkPlayCn(g.play)} ${g.items.length} 注`).join(' · ');
  const div = document.createElement('div');
  div.id = 'milkFillNext';
  div.className = 'mk-next';
  div.innerHTML = `<span>还有 <b>${total}</b> 注没带过来：${esc(txt)}。竞彩一张票只能一个玩法，填完这张再点右边继续。</span>
    <button type="button" class="btn btn-primary" id="milkFillNextBtn">继续填下一组</button>`;
  const form = document.querySelector('details.bet-form');
  if(form && form.parentNode) form.parentNode.insertBefore(div, form);
  else {
    const host = document.querySelector('#mybets');
    if(host) host.insertBefore(div, host.firstChild);
  }
  const btn = div.querySelector('#milkFillNextBtn');
  if(btn) btn.onclick = () => {
    const group = _milkFillRest[0];
    if(!group) return;
    fillBetGroup(group, _milkFillRest.slice(1));
  };
}

/* ---------- 变盘监控（FbOddsMove，2026-11-05） ----------
   赔率相对上一次采样变动 ≥5% 就记一条，采集器写库时同步落台账。
   这里只回答「几点变的、哪一档、从多少到多少、距开赛多久」，
   不给方向、不推注——判断会过时，事实不会。 */

const MOVE_PLAY_NAME = { BF: '比分', BQ: '半全场', JQ: '总进球', SPF: '胜平负', NSPF: '让球' };

async function loadOddsMoves(){
  const box = $('#milkMoves');
  if(!box) return;
  try{
    const d = await api('/api/odds/moves?take=800');
    const rows = d.rows || [];
    const thr = d.threshold != null ? (d.threshold * 100).toFixed(0) : '5';
    const scan = d.lastScan ? String(d.lastScan).slice(5, 16).replace('T', ' ') : '—';

    // 监控自己也要有心跳：采样正常每 8 分钟一次，超过 30 分钟没动静就是停了。
    // 没有这行的话，「今天没变盘」和「进程死了」在页面上长得一模一样。
    const lagMin = d.lastScan ? Math.round((Date.now() - new Date(d.lastScan).getTime()) / 60000) : null;
    const liveTag = lagMin == null ? '<span class="mv-stale">⚠ 从未采样</span>'
      : lagMin > 30 ? `<span class="mv-stale">⚠ 采样已停 ${lagMin} 分钟</span>`
      : `<span class="mv-live">采样正常 · ${lagMin} 分钟前</span>`;

    if(!rows.length){
      box.innerHTML = `<div class="mv-head">变盘监控 ${liveTag}
        <span class="dim">· 今日没有 ≥${thr}% 的变动 · 最近采样 ${esc(scan)}</span></div>`;
      return;
    }

    // 一场一行：同一场会在几个玩法、十几个档上同时动，逐条铺开看不清。
    const byMatch = new Map();
    for(const r of rows){
      if(!byMatch.has(r.matchId)) byMatch.set(r.matchId, []);
      byMatch.get(r.matchId).push(r);
    }

    const items = [...byMatch.entries()].map(([mid, list]) => {
      const sorted = list.slice().sort((a, b) => Math.abs(b.changePct) - Math.abs(a.changePct));
      const first = list.reduce((a, b) => (String(a.moveAt) < String(b.moveAt) ? a : b));
      const up = list.filter(r => Number(r.changePct) > 0).length;
      return {
        matchId: mid,
        head: list[0],
        count: list.length,
        up,
        down: list.length - up,
        firstAt: first.moveAt,
        minToKick: first.minutesToKick,
        status: first.matchStatus,
        top: sorted.slice(0, 3)
      };
    }).sort((a, b) => String(b.firstAt).localeCompare(String(a.firstAt)));

    // 踢完的比赛留在榜首只会占地方：监控的价值在「还没开赛的」。
    // 完赛的折叠到 <details> 里，想复盘再展开，不默认铺开。
    const liveItems = items.filter(it => it.status !== 3);
    const doneItems = items.filter(it => it.status === 3);

    const chip = r => {
      const pct = Number(r.changePct) * 100;
      const cls = pct > 0 ? 'mv-up' : 'mv-down';
      const sign = pct > 0 ? '+' : '';
      return `<span class="mv-chip ${cls}">${esc(MOVE_PLAY_NAME[r.playType] || r.playType)} ${esc(r.optionName || '')}
        <b>${Number(r.prevOdds).toFixed(2)}→${Number(r.currOdds).toFixed(2)}</b> ${sign}${pct.toFixed(1)}%</span>`;
    };

    const rowHtml = it => `<tr>
        <td class="mono">${esc(String(it.firstAt).slice(5, 16).replace('T', ' '))}</td>
        <td>${esc(it.head.leagueName || '')} ${esc(it.head.homeTeam || '')} vs ${esc(it.head.awayTeam || '')}</td>
        <td class="mono">${it.count} 条<span class="dim">（升 ${it.up} / 降 ${it.down}）</span></td>
        <td>${it.top.map(chip).join('')}</td>
        <td class="mono dim">${it.minToKick != null ? it.minToKick + ' min' : '—'}</td>
      </tr>`;

    const body = liveItems
      .slice().sort((a, b) => (a.minToKick ?? 9e9) - (b.minToKick ?? 9e9))
      .slice(0, 40).map(rowHtml).join('');
    const doneBlock = doneItems.length
      ? `<details class="mv-done"><summary class="dim" style="cursor:pointer;margin:8px 2px 4px">已完赛 ${doneItems.length} 场（点击展开复盘）</summary>
         <div class="board-scroll"><table class="tbl mv-tbl"><thead><tr>
           <th>首次变动</th><th>场次</th><th>条数</th><th>变动最大的档（旧→新）</th><th>距开赛</th>
         </tr></thead><tbody>${doneItems.slice(0, 40).map(rowHtml).join('')}</tbody></table></div></details>`
      : '';

    const scopeLine = doneItems.length
      ? `未开赛 <b>${liveItems.length}</b> 场 · 完赛 ${doneItems.length} 场已折叠`
      : `${items.length} 场`;

    box.innerHTML = `<div class="mv-head">变盘监控 ${liveTag}
        <span class="dim">· 阈值 ≥${thr}% · 今日 ${rows.length} 条 / ${scopeLine} · 最近采样 ${esc(scan)}</span>
      </div>
      ${body ? `<div class="board-scroll"><table class="tbl mv-tbl"><thead><tr>
        <th>首次变动</th><th>场次</th><th>条数</th><th>变动最大的档（旧→新）</th><th>距开赛</th>
      </tr></thead><tbody>${body}</tbody></table></div>`
        : `<div class="dim" style="margin:6px 2px">今天的比赛都踢完了或还没开赛，没有待开赛场次的变盘。</div>`}
      ${doneBlock}
      <p class="dim" style="margin:6px 2px">只记事实，不给方向、不影响出注。距开赛越近的变盘通常越有信息量；临场 3 小时内集中跳动的，是资金进场的痕迹。</p>`;
  }catch(e){
    box.innerHTML = `<div class="dim">变盘监控加载失败：${esc(e.message || e)}</div>`;
  }
}

/* ---------- 逐场走向（FbMatchTrend + FbOddsScanLog，2026-11-05） ----------
   变盘监控说的是「哪一分钟动了哪一档」，这里说的是「这一场整体往哪边走」。

   两件事必须一起看：
     台账（scan-log）—— 今天采了几轮、哪两轮之间断了。缺了这段，明细表里的
                        「价格没变」和「根本没去采」长得一模一样。
     走向（trend）   —— 每场每玩法的首轮价 → 现价，以及 SPF 三线的去水概率迁移。

   标签只认一条规则：SPF 去水概率迁移 ≥2 个百分点才算「走强」，否则「无明显迁移」。
   不做主观判断——11-04 那次栽的就是「看着像」，不是「算出来是」。 */

const TREND_TAG_CLASS = t => {
  if(!t) return 'tr-tag';
  if(t.indexOf('切换') >= 0) return 'tr-tag switch';
  if(t === '无明显迁移') return 'tr-tag';
  return 'tr-tag on';
};

async function loadOddsTrend(opts){
  const box = $('#oddsTrend');
  if(!box) return;
  opts = opts || {};
  // 默认只看未开赛；历史复盘时传 date + status=all 把完场的一起拉回来。
  const qDate = opts.date || '';
  const qStatus = opts.status || 'open';
  const isHist = qStatus === 'all';
  try{
    // 台账和走向一起取：只给走向不给台账，看不出数据是不是断过
    const [log, d, sd, tg] = await Promise.all([
      api(qDate ? `/api/odds/scan-log?date=${qDate}` : '/api/odds/scan-log').catch(() => null),
      api(`/api/odds/trend${qDate ? `?date=${qDate}` : ''}${qDate ? '&' : '?'}status=${qStatus}`).catch(() => null),
      api(qDate ? `/api/odds/score-diag?date=${qDate}&status=${qStatus}` : `/api/odds/score-diag?status=${qStatus}`).catch(() => null),
      api('/api/odds/trend/tags?days=30').catch(() => null)
    ]);
    if(!d){ box.innerHTML = '<div class="dim">逐场走向暂不可用</div>'; return; }

    const ms = d.matches || [];
    const lagMin = d.lastScan ? Math.round((Date.now() - new Date(d.lastScan).getTime()) / 60000) : null;
    // lastScan 是全局最新采样心跳，只在「今日未开赛」视图里当状态读；
    // 历史复盘时它说的是「现在采到哪了」，跟所查那天的走向无关，别当那天的心跳展示。
    const liveTag = isHist
      ? `<span class="dim">历史复盘 · ${qDate}</span>`
      : lagMin == null ? '<span class="mv-stale">⚠ 从未采样</span>'
      : lagMin > 30 ? `<span class="mv-stale">⚠ 采样已停 ${lagMin} 分钟</span>`
      : `<span class="mv-live">采样正常 · ${lagMin} 分钟前</span>`;

    // 历史查询入口：默认只看未开赛。切到「历史」按日期拉完场场次复盘。
    const todayYmd = localYmd(new Date());
    const histBar = `<span class="tr-hist">
        <span class="dim">只看未开赛</span>
        <label class="dim">或查历史
          <input type="date" data-trend-date value="${qDate || ''}" max="${todayYmd}" />
        </label>
        <button type="button" class="btn btn-ghost" data-trend-hist>${isHist ? '返回未开赛' : '查历史（含完场）'}</button>
      </span>`;

    // 台账摘要 + 断档。断档是这次要解决的核心问题：先看见，才谈得上修。
    let statLine = '';
    let gapLine = '';
    if(log){
      const gaps = log.gaps || [];
      const gapMin = gaps.reduce((a, g) => a + Number(g.minutes || 0), 0);
      statLine = `<div class="tr-stat">
        <span>${isHist ? '该日' : '今日'}采样 <b>${log.rounds || 0}</b> 轮</span>
        <span>覆盖 <b>${log.coveredMinutes || 0}</b> 分钟</span>
        <span>失败 <b>${log.errorRounds || 0}</b> 轮</span>
        <span>断档 <b>${gaps.length}</b> 段${gapMin ? `（累计 ${gapMin} 分钟）` : ''}</span>
        <span>场次 <b>${ms.length}</b></span>
      </div>`;
      if(gaps.length){
        const top = gaps.slice().sort((a, b) => b.minutes - a.minutes).slice(0, 3)
          .map(g => `${String(g.from).slice(11, 16)}→${String(g.to).slice(11, 16)} 空 ${g.minutes} 分钟`).join('；');
        gapLine = `<div class="tr-gap">⚠ 采集断档：${esc(top)}${gaps.length > 3 ? ` 等 ${gaps.length} 段` : ''}
          —— 这些时段没有数据，不是「没变化」</div>`;
      }
    }

    if(!ms.length){
      box.innerHTML = `<div class="mv-head">逐场走向 ${liveTag}${histBar}</div>${statLine}${gapLine}
        <div class="dim">${isHist ? `这一天（${qDate}）没有走向记录，或该日比赛已全部完场且无未开赛场次。` : '今天还没有走向记录（需至少一轮采样）。'}</div>`;
      bindTrendHist(box, isHist);
      return;
    }

    const num = v => (v == null || v === '' ? '—' : Number(v).toFixed(2));
    const pp = v => {
      if(v == null) return '<span class="tr-pp">—</span>';
      const n = Number(v);
      const cls = n > 0 ? 'up' : n < 0 ? 'down' : '';
      return `<span class="tr-pp ${cls}">${n > 0 ? '+' : ''}${n.toFixed(1)}</span>`;
    };
    const triple = (o, c) => o && c
      ? `<span class="tr-line"><span class="o1">${num(o.openWin)}/${num(o.openDraw)}/${num(o.openLoss)}</span>
         <span class="arw">→</span>${num(c.currWin)}/${num(c.currDraw)}/${num(c.currLoss)}</span>`
      : '<span class="dim">—</span>';

    // 各玩法的热门档位移。只列真动过的：一屏 40 场，全列满等于没列。
    const playChips = p => {
      const moved = (p.plays || []).filter(x =>
        x.topChanged || (x.topShiftPct != null && Math.abs(Number(x.topShiftPct)) >= 1));
      if(!moved.length) return '<span class="dim">—</span>';
      return moved.map(x => {
        // topShiftPct 是「热门档赔率变化率」：(末-初)/初。赔率降=该档变热。
        // 为了跟右侧「概率变化 pp」同一套颜色语义（升=热=红、降=冷=绿），把符号翻过来：
        // 赔率降（变热）→ 显示正号、标红；赔率升（变冷）→ 负号、标绿。
        const pct = x.topShiftPct == null ? null : -Number(x.topShiftPct);
        const cls = pct == null ? '' : pct > 0 ? 'mv-up' : 'mv-down';
        const sign = pct == null ? '' : (pct > 0 ? '+' : '');
        const label = x.topChanged
          ? `${esc(x.firstTopName || '')}→${esc(x.lastTopName || '')}`
          : `${num(x.firstTopOdds)}→${num(x.lastTopOdds)}`;
        return `<span class="mv-chip ${cls}">${esc(x.playName)} <b>${label}</b>${pct != null ? ` ${sign}${pct.toFixed(1)}%` : ''}</span>`;
      }).join('');
    };

      const rows = ms.map(m => {
      const tt = String(m.matchTime || '');
      const kick = tt ? `${tt.slice(5, 10)} ${tt.slice(11, 16)}` : '—';
      const m2k = m.minutesToKick;
      const m2kTag = m2k == null ? '' : m2k < 0 ? '<span class="dim">已开赛</span>'
        : m2k <= 180 ? `<span class="mv-stale" style="color:#e6c36a">${m2k} 分钟</span>`
        : `<span class="dim">${m2k} 分钟</span>`;
      // 有赛果就显示赛果：比赛踢完了还写「已开赛」，标签就永远没法验收，看着像数据没更新。
      const whenTag = m.finished && m.homeScore != null
        ? `<span class="tr-score">${m.homeScore}:${m.awayScore}<i>完赛</i></span>`
        : m2kTag;
      const hit = m.tagHit;
      const hitTag = hit === true ? '<span class="tr-hit ok" title="标签方向与赛果一致">✓</span>'
        : hit === false ? '<span class="tr-hit bad" title="标签方向与赛果相反">✗</span>' : '';
      // 亚盘让球线。500 的符号约定：正 = 客队让球，负 = 主队让球。
      // 竞彩让球胜平负（NSPF）的官方让球数库里没有，页面上说「让几球」一律以亚盘为准。
      const ahFmt = v => {
        const n = Number(v);
        if (!isFinite(n)) return '';
        return n > 0 ? `客让 ${n.toFixed(2)}` : n < 0 ? `主让 ${Math.abs(n).toFixed(2)}` : '平手';
      };
      const ah = (m.ahOpen != null && isFinite(Number(m.ahOpen)))
        ? `<div class="dim" style="font-size:11px" title="亚盘让球线（平均值公司初盘）。正=客让、负=主让。竞彩让球的官方让球数不在库里，判断让球方向以此为准">亚盘 ${ahFmt(m.ahOpen)}${m.ahLast != null && Number(m.ahLast) !== Number(m.ahOpen) ? ` → ${ahFmt(m.ahLast)}` : ''}</div>`
        : '';
      const s = m.spf;
      return `<tr>
        <td class="mono">${esc(kick)}<div style="font-size:11px">${whenTag}</div></td>
        <td>${esc(m.leagueName || '')}<div class="dim" style="font-size:11.5px">${esc(m.homeTeam || '')} vs ${esc(m.awayTeam || '')}</div>${ah}</td>
        <td class="mono dim">${m.rounds} 轮</td>
        <td>${triple(s, s)}</td>
        <td class="tr-line" style="white-space:nowrap">${s
          ? `主 ${pp(s.shiftWinPp)} · 平 ${pp(s.shiftDrawPp)} · 客 ${pp(s.shiftLossPp)}`
          : '<span class="dim">—</span>'}</td>
        <td>${playChips(m)}</td>
        <td class="mono">${m.moves} 条${m.lateMoves ? `<span class="dim">（临场 ${m.lateMoves}）</span>` : ''}</td>
        <td><span class="${TREND_TAG_CLASS(m.trendTag)}">${esc(m.trendTag || '未判定')}</span>${hitTag}</td>
      </tr>`;
    }).join('');

    // 标签验收：拿「标签指向的那一边」直接对赛果，不看赔率。
    // 这是标签唯一的验收口径——不展示它，标签就永远只是一句好听的描述。
    let accLine = '';
    if(tg && tg.rows){
      const parts = tg.rows
        .filter(r => Number(r.settled) >= 5 && r.hitRate != null)
        .sort((a, b) => Number(b.settled) - Number(a.settled))
        .map(r => {
          const pct = Number(r.hitRate) * 100;
          const low = pct < 20 && Number(r.settled) >= 20;
          return `<span class="${low ? 'bad' : ''}">${esc(r.tag)} <b>${pct.toFixed(0)}%</b>（${r.settled} 场）</span>`;
        });
      if(parts.length){
        accLine = `<div class="tr-acc">标签验收（近 ${tg.days} 天，方向对赛果）：
          ${parts.join(' · ')}
          <div class="dim">绿色标出的标签命中率异常低，样本够之前只当复盘记录读，不反向下注。</div></div>`;
      }
    }

    box.innerHTML = `<div class="mv-head">逐场走向 ${liveTag}${histBar}
        <span class="dim">· 每场每玩法「首轮 → 现价」· 概率迁移单位是百分点（去水后）· 阈值 ≥${((d.threshold || 0.05) * 100).toFixed(0)}%</span>
      </div>${statLine}${gapLine}${accLine}
      <div class="board-scroll"><table class="tbl mv-tbl tr-tbl"><thead><tr>
        <th>开赛</th><th>场次</th><th>采样</th><th>胜平负 初→现</th><th title="胜平负三边「去水概率」的变化，单位百分点：正 = 这边概率升、负 = 降。这是概率变化，不是让球数——让球看「对阵」列下方的亚盘">胜平负概率变化 pp</th>
        <th>热门档位移</th><th>变盘</th><th>标签</th>
      </tr></thead><tbody>${rows}</tbody></table></div>
      <p class="dim" style="margin:6px 2px">标签只看胜平负去水概率迁移：某一边升 ≥2 个百分点才叫「走强」，三边都不足 2 就写「无明显迁移」。
        标签后面的 ✓/✗ 是拿标签方向对赛果：✗ 不代表标签算错，代表市场那边判断错了——标签只记录赔率往哪边动。
        热门档位移看的是最低赔那一档——它换了，比同一个档位挪几个点更有信息量；百分比是「热度变化」（赔率降记为正、标红=变热，与右侧概率 pp 同一套颜色语义）。临场变盘（≤180 分钟）单独计数。</p>`;
    bindTrendHist(box, isHist);
    renderScoreDiag(sd, ms);
  }catch(e){
    box.innerHTML = `<div class="dim">逐场走向加载失败：${esc(e.message || e)}</div>`;
  }
}

// 逐场走向的历史查询入口：日期 + 完场开关。
// 未开赛视图点按钮 → 按所选日期查历史（含完场）；历史视图点按钮 → 返回未开赛。
function bindTrendHist(box, isHist){
  if(!box) return;
  const dateInput = box.querySelector('[data-trend-date]');
  const histBtn = box.querySelector('[data-trend-hist]');
  if(histBtn) histBtn.onclick = () => {
    if(isHist){
      loadOddsTrend({ date: '', status: 'open' });
    } else {
      const date = dateInput ? dateInput.value : '';
      loadOddsTrend({ date, status: 'all' });
    }
  };
  if(dateInput) dateInput.onchange = () => {
    loadOddsTrend({ date: dateInput.value, status: 'all' });
  };
}

/* ---------- 净胜球诊断（FbScoreDiag，2026-11-05） ----------
   比分盘 31 档去水后折叠成净胜球分布。回答的是「市场认为这场会赢几个」，
   不是「我们认为会赢几个」。

   三件事必须同时摆出来，否则会被误读：
     1. 期望净胜球和它的区间——单独一个 +0.48 看起来像预测，配上分布才知道它有多虚
     2. 尾部概率——1:9 那种不是「预测到了」，是尾部真的发生了
     3. 与胜平负盘的差——两个盘口对同一件事给出不同答案时，说明市场内部不一致

   466 场回测：MAE 1.32 球，四舍五入全对 24.7%，各档校准误差 <2pp。
   所以这段的定位是「风险描述」，不是「比分推荐」。 */
function renderScoreDiag(sd, trendMatches){
  const box = $('#scoreDiag');
  if(!box) return;
  if(!sd || !sd.rows || !sd.rows.length){
    box.innerHTML = '<div class="mv-head">净胜球诊断 <span class="dim">· 无比分盘快照</span></div>';
    return;
  }

  // 胜平负盘（SPF）去水后的主胜率，用来和比分盘隐含的主胜率对表
  const spfHome = new Map();
  (trendMatches || []).forEach(m => {
    const s = m.spf;
    if(!s || !s.currWin || !s.currDraw || !s.currLoss) return;
    const w = 1 / Number(s.currWin), dr = 1 / Number(s.currDraw), l = 1 / Number(s.currLoss);
    if(w + dr + l > 0) spfHome.set(String(m.matchId), w / (w + dr + l) * 100);
  });

  const pct = v => v == null ? '—' : (Number(v) * 100).toFixed(1) + '%';
  const bar = dist => {
    if(!dist || !dist.length) return '<span class="dim">—</span>';
    return `<div class="sd-bar">${dist.map(x => {
      const cls = x.gd < 0 ? 'neg' : x.gd === 0 ? 'zero' : 'pos';
      return `<span class="sd-seg ${cls}" style="width:${x.pct}%"></span>`;
    }).join('')}</div>`;
  };
  const expCell = r => {
    const e = r.expGd == null ? null : Number(r.expGd);
    if(e == null) return '<span class="dim">—</span>';
    const cls = e > 0.05 ? 'up' : e < -0.05 ? 'down' : '';
    const o = r.expGdOpen == null ? null : Number(r.expGdOpen);
    const mv = r.expGdMove == null ? null : Number(r.expGdMove);
    const sign = e > 0 ? '+' : '';
    return `<span class="sd-exp ${cls}">${sign}${e.toFixed(2)}</span>
      <div class="sd-sub">开 ${o == null ? '—' : (o > 0 ? '+' : '') + o.toFixed(2)}
      ${mv != null && Math.abs(mv) >= 0.1 ? `· ${mv > 0 ? '↑' : '↓'}${Math.abs(mv).toFixed(2)}` : ''}</div>`;
  };
  const tailCell = r => {
    const p3 = r.p3Plus == null ? null : Number(r.p3Plus);
    const m3 = r.pMinus3 == null ? null : Number(r.pMinus3);
    if(p3 == null && m3 == null) return '<span class="dim">—</span>';
    const pmove = r.p3PlusMove == null ? 0 : Number(r.p3PlusMove) * 100;
    const mmove = r.pMinus3Move == null ? 0 : Number(r.pMinus3Move) * 100;
    return `<span class="sd-sub">主胜≥3 <b>${pct(p3)}</b>${Math.abs(pmove) >= 1 ? ` (${pmove > 0 ? '+' : ''}${pmove.toFixed(1)})` : ''}</span>
      <div class="sd-sub">客胜≥3 <b>${pct(m3)}</b>${Math.abs(mmove) >= 1 ? ` (${mmove > 0 ? '+' : ''}${mmove.toFixed(1)})` : ''}</div>`;
  };
  const tagCell = r => {
    const t = r.tailTag || '尾部未动';
    const batch = t.indexOf('整批') >= 0;
    const cls = batch ? 'sd-tail batch' : (t === '尾部未动' ? 'sd-tail' : 'sd-tail warn');
    const drops = (r.deepNegDrop || 0) + (r.deepPosDrop || 0);
    return `<span class="${cls}">${esc(t)}</span>
      ${drops >= 3 ? `<div class="sd-sub">深档降价 ${r.deepNegDrop || 0}/${r.deepPosDrop || 0} 档</div>` : ''}`;
  };
  // 比分盘 vs 胜平负盘：两个盘口对「主胜」给出的概率差。差大了说明市场内部不一致。
  // 阈值 3pp：446 场里 ≥3pp 的 46 场，主胜率比一致组高 12.9pp（分层后三层同向，但样本小）。
  const diffCell = r => {
    const h = spfHome.get(String(r.matchId));
    const p = r.pHome == null ? null : Number(r.pHome) * 100;
    if(h == null || p == null) return '<span class="dim">—</span>';
    const d = p - h;
    return `<span class="sd-diff ${Math.abs(d) >= 3 ? 'big' : ''}">${d > 0 ? '+' : ''}${d.toFixed(1)} pp</span>`;
  };

  const rows = sd.rows.map(r => {
    const tt = String(r.matchTime || '');
    const kick = tt ? `${tt.slice(5, 10)} ${tt.slice(11, 16)}` : '—';
    const dist = r.dist || [];
    const ph = r.pHome == null ? null : Number(r.pHome) * 100;
    const pd = r.pDraw == null ? null : Number(r.pDraw) * 100;
    const pa = r.pAway == null ? null : Number(r.pAway) * 100;
    return `<tr>
      <td class="mono">${esc(kick)}<div class="dim" style="font-size:11px">${esc(r.leagueName || '')}</div></td>
      <td>${esc(r.homeTeamName || '')} vs ${esc(r.awayTeamName || '')}
        <div class="dim" style="font-size:11px">${r.rounds} 轮 · 期望总进球 ${r.expTotal == null ? '—' : Number(r.expTotal).toFixed(2)}</div></td>
      <td>${expCell(r)}</td>
      <td>${bar(dist)}
        <div class="sd-sub">主 ${ph == null ? '—' : ph.toFixed(1)} · 平 ${pd == null ? '—' : pd.toFixed(1)} · 客 ${pa == null ? '—' : pa.toFixed(1)}</div></td>
      <td>${tailCell(r)}</td>
      <td>${tagCell(r)}</td>
      <td>${diffCell(r)}</td>
    </tr>`;
  }).join('');

  box.innerHTML = `<div class="mv-head">净胜球诊断
      <span class="dim">· 比分盘 ${sd.matches} 场 · 期望净胜球为封盘值 · 分布条左绿右红（客胜→平→主胜）</span>
    </div>
    <div class="board-scroll"><table class="tbl mv-tbl sd-tbl"><thead><tr>
      <th>开赛</th><th>场次</th><th>期望净胜球</th><th>分布 / 主平客</th>
      <th>尾部概率</th><th>尾部移动</th><th>对比分盘</th>
    </tr></thead><tbody>${rows}</tbody></table></div>
    <p class="dim" style="margin:6px 2px">
      <b>怎么用</b>：期望净胜球是市场定价，不是预测——466 场回测误差平均 1.32 球，四舍五入全对只有 24.7%，
      所以「+0.48」请读成「市场认为主队略占优」，不能读成「赢半球」。
      尾部概率是净胜/净负 ≥3 球的定价；「整批降价」指 3 个以上深档同时降价 ≥5%，
      11-04 朗斯场就是这种形态，但在 105 场样本里它对是否大比分没有区分度，只记录、不作信号。
      「对比分盘」= 比分盘隐含主胜率 − 胜平负盘去水主胜率，≥3pp 标黄。
    </p>`;
}

// 方向闸（2026-11-05）：模型与市场背离的场次在这里标注。
// 当天下午就降级成「只看不拦」——用 444 场、3745 注回测，同向命中反而不如反向，
// 硬砍是负 alpha。所以这里只摆事实，注照发。
function milkGateHtml(g){
  if(!g || !g.rows || !g.rows.length) return '';
  const dirName = d => d === '3' ? '主胜' : d === '1' ? '平' : d === '0' ? '客胜' : '—';
  const alertName = c => c === 'trap-both' ? '亚盘+必发同时背离（典型诱盘）'
                     : c === 'trap-asian' ? '亚盘与市场背离（疑似诱盘）'
                     : c === 'trap-exchange' ? '必发与市场背离' : '';
  const rows = g.rows.map(r => {
    const diverged = r.verdict === 'diverge';
    const market = r.marketHomePct != null
      ? `（主 ${r.marketHomePct}% / 平 ${r.marketDrawPct}% / 客 ${r.marketAwayPct}%）` : '';
    const tag = diverged
      ? `<span class="gate-tag gate-warn">背离 ${r.blockedPicks} 注</span>`
      : `<span class="gate-tag gate-ok">同向</span>`;
    return `<div class="gate-row">
      <span class="gate-main">${esc(r.matchNo || '')} ${esc(r.homeTeam || '')} vs ${esc(r.awayTeam || '')}</span>
      <span class="gate-dir">这一注 <b>${dirName(r.pickDirection)}</b> · 市场 <b>${dirName(r.marketDirection)}</b>${market}</span>
      ${tag}
      ${alertName(r.alertCode) ? `<span class="gate-alert">${alertName(r.alertCode)}</span>` : ''}
      ${r.blockedBest ? `<span class="gate-best">背离的最高概率注：${esc(r.blockedBest)}</span>` : ''}
    </div>`;
  }).join('');

  const head = g.diverged > 0
    ? `方向闸：<b>${g.diverged}</b> 场与市场背离`
    : '方向闸：本批全部与市场同向';
  return `<div class="milk-gate">
    <div class="gate-head">${head}
      <span class="dim">· 只标注、不拦注（444 场 3745 注回测：同向命中 19.6%、反向 18.0%，差在噪声内，而反向回报好 27 个点）。亚盘方向命中率 47.7%，仅作诱盘告警</span>
    </div>${rows}</div>`;
}

// 出榜漏斗：13 场受注 → 几场有奖金 → 几场模型认识 → 几注过门槛 → 几注上榜。
// 2026-11-05 加：榜空的时候，原来只有一句「今天没有够格的大奶」，
// 看不出是门槛太严、还是模型根本没跑起来、还是队名对不上被整场丢掉。
// 这三种情况要动的代码完全不同，页面必须先自己说清楚卡在哪一层。
function milkFunnelHtml(g, hasPicks){
  const f = (g && g.funnel) || {};
  if(f.recs == null) return '';
  const flow = [
    ['受注', f.recs, '场'],
    ['有奖金', f.withOdds, '场'],
    ['队名齐', f.named, '场'],
    ['模型认识', f.known, '场'],
    ['样本够量', f.thinSample != null ? Math.max(0, (f.known || 0) - (f.thinSample || 0)) : null, '场'],
    ['有分布', f.distributed, '场'],
    ['有候选', f.candidates, '场'],
    ['过闸', f.afterGate, '注'],
    ['过门槛', f.afterEv, '注'],
    ['上榜', f.final, '注']
  ];
  const cells = flow.map(([k, v, u]) =>
    `<span class="fn-cell"><i>${esc(k)}</i><b>${v == null ? '—' : v}</b><em>${u}</em></span>`).join('');
  const skipped = (f.skipped || []).slice(0, 8);
  const noteHtml = f.scoresReady === false
    ? `<div class="fn-warn">比分模型没跑起来，整张榜必然为空：${esc(f.scoresNote || '原因未知')}</div>` : '';
  // 逆市场撤注（2026-11-05）：不写出来，用户只会看到「昨天 6 注今天 4 注」，以为又是随机波动。
  const dropHtml = Number(f.divergentDropped || 0) > 0
    ? `<div class="fn-warn">逆市场撤注 <b>${f.divergentDropped}</b> 注：这一注的方向和市场最强方向相反，且市场方向占比 ≥45%，按规则撤下（周四011 那种「市场客胜 51% 却发胜胜」的注就死在这一层）</div>`
    : '';
  const skipHtml = skipped.length
    ? `<div class="fn-skip">${skipped.map(s => `<span>· ${esc(s)}</span>`).join('')}</div>` : '';
  // 样本熔断（2026-11-05）：回测台 2405 场实测，两队样本都少时模型 Brier 比市场差 0.119，
  // 是样本充足场次（差 0.037）的 3.2 倍。这一层挡掉的场次必须点名，否则看起来像榜无缘无故少了。
  const thinHtml = Number(f.thinSample || 0) > 0
    ? `<div class="fn-warn">样本不足撤场 <b>${f.thinSample}</b> 场：主客队各需 ≥3 场历史样本，不够时模型给的是「联赛均值+主场优势」而不是这两队的对阵（回测里这类场次比市场差 0.119 Brier，是样本充足场次的 3.2 倍）</div>`
    : '';

  return `<div class="milk-funnel">
    <div class="fn-head">出榜漏斗
      <span class="dim">· 每场都要过这几层；被砍的场次会列出原因，不是「没算出来」四个字</span>
    </div>
    <div class="fn-flow">${cells}</div>
    ${noteHtml}${dropHtml}${thinHtml}${skipHtml}
  </div>`;
}

// 「模型 vs 市场」对照表（2026-11-05 加，方案 2：只展示、不出注）。
// 大奶榜有样本熔断，欧战球队常常整天空榜；空榜不等于算不出来——模型对每场都算了三边，
// 只是样本不足不敢出注。与其让人盯着空榜猜，不如把「模型怎么想 vs 市场怎么想」摊开。
// 这一块永远不参与出票，只是给用户看模型的立场，再决定要不要信它。
function milkShowHtml(rows){
  if(!rows || !rows.length) return '';
  const dirName = d => d === '3' ? '主胜' : d === '1' ? '平' : d === '0' ? '客胜' : '—';
  const pct = v => v == null ? '—' : Number(v).toFixed(1) + '%';
  const statusTag = s => s === 'thin-sample'
    ? '<span class="show-tag show-thin">样本不足·不出注</span>'
    : s === 'unknown-team'
      ? '<span class="show-tag show-unknown">模型不认识·不出注</span>'
      : s === 'no-odds'
        ? '<span class="show-tag show-unknown">无快照</span>'
        : s === 'no-name'
          ? '<span class="show-tag show-unknown">队名缺失</span>'
          : '<span class="show-tag show-known">样本充足</span>';
  const cells = rows.map(r => {
    // 模型和市场最强方向不一致时高亮，提示「模型在跟市场对着干」。
    const diverge = r.modelDirection != null && r.marketDirection != null && r.modelDirection !== r.marketDirection;
    const modelCell = r.modelHomePct == null
      ? '<span class="dim">模型没算出</span>'
      : `<span class="show-three">主 <b>${pct(r.modelHomePct)}</b> · 平 <b>${pct(r.modelDrawPct)}</b> · 客 <b>${pct(r.modelAwayPct)}</b></span>`;
    const marketCell = r.marketHomePct == null
      ? '<span class="dim">市场没算出</span>'
      : `<span class="show-three">主 <b>${pct(r.marketHomePct)}</b> · 平 <b>${pct(r.marketDrawPct)}</b> · 客 <b>${pct(r.marketAwayPct)}</b></span>`;
    const games = r.status === 'thin-sample'
      ? ` <span class="dim">（样本 ${r.homeGames}/${r.awayGames} 场）</span>` : '';
    return `<tr${diverge ? ' class="show-diverge"' : ''}>
      <td class="match-no">${esc(r.matchNo || '')}</td>
      <td class="teams-cell"><div class="teams">${esc(r.homeTeam || '')}<span class="vs">VS</span>${esc(r.awayTeam || '')}</div>
        <div class="league">${esc(r.leagueName || '')}</div></td>
      <td>${esc(r.matchTime || '')}</td>
      <td>${modelCell}</td>
      <td>${marketCell}</td>
      <td>${statusTag(r.status)}${games}${diverge ? ' <span class="show-diverge-note">模型指' + dirName(r.modelDirection) + '、市场指' + dirName(r.marketDirection) + '</span>' : ''}</td>
    </tr>`;
  }).join('');
  return `<div class="milk-show">
    <div class="show-head">模型 vs 市场
      <span class="dim">· 只展示、不出注。每场把模型给的三边概率和市场去水的三边概率并排摆出来，样本不足或模型不认识的场次照列，但明确标「不出注」，让你自己判断模型到底有没有立场</span>
    </div>
    <div class="board-scroll"><table class="tbl rec-tbl show-tbl"><thead><tr>
      <th>场次</th><th>对阵</th><th>开赛</th><th>模型（主/平/客）</th><th>市场（主/平/客）</th><th>状态</th>
    </tr></thead><tbody>${cells}</tbody></table></div>
  </div>`;
}

function renderMilkBoard(b, strongOnly){
  let picks = (b.milkPicks || []).slice();
  if(strongOnly) picks = picks.filter(it => it.modelProbability != null && Number(it.modelProbability) >= 12);

  // 一场一行：同一场在比分 / 半全场 / 总进球里的注合并到同一行的三列里。
  // 之前按玩法分三张表，费内巴切-利物浦在两三张表里各出现一次，看着像推了三场。
  const byMatch = new Map();
  for(const it of picks){
    const key = it.matchId != null ? String(it.matchId) : `${it.matchNo}|${it.homeTeam}`;
    let g = byMatch.get(key);
    if(!g){
      g = { matchNo: it.matchNo, homeTeam: it.homeTeam, awayTeam: it.awayTeam,
            leagueName: it.leagueName, matchTime: it.matchTime, plays: {}, bestEv: 0, bestProb: 0 };
      byMatch.set(key, g);
    }
    (g.plays[it.playType] = g.plays[it.playType] || []).push(it);
    g.bestEv = Math.max(g.bestEv, Number(it.ev) || 0);
    g.bestProb = Math.max(g.bestProb, Number(it.modelProbability) || 0);
  }

  // 2026-11-04 晚：排序口径从 EV 改成命中率（模型概率）。
  // EV = 概率 × 赔率，赔率越离谱越占便宜，会把 1.9% 的 3:0@80 排到 17.8% 的胜胜前面。
  const rows = [...byMatch.values()].sort((x, y) => {
    if(y.bestProb !== x.bestProb) return y.bestProb - x.bestProb;
    return officialMatchSort({ matchNo: x.matchNo }, { matchNo: y.matchNo });
  });
  for(const g of rows)
    for(const k in g.plays) g.plays[k].sort((x, y) => Number(y.modelProbability) - Number(x.modelProbability));

  // 折中：EV 的信息不丢，但不参与排序——全榜只挑一注标「EV 最高」。
  // 注意它大概率不是最可能中的那注，角标只是「纯赔率视角下最划算」，标题里写清楚。
  const pickKey = it => `${it.matchId != null ? it.matchId : it.matchNo}|${it.playType}|${it.optionCode}`;
  let evTop = null;
  for(const it of picks) if(it.ev != null && (evTop == null || Number(it.ev) > Number(evTop.ev))) evTop = it;
  const evTopKey = evTop ? pickKey(evTop) : null;

  const tm = v => v ? new Date(v).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
  let html = `<div class="board" data-board="jc">
    <div class="board-head">
      <span class="badge badge-jc">竞彩大奶</span>
      <span class="meta">共 <b>${b.total || 0}</b> 场受注 · 大奶 <b>${picks.length}</b> 注 / <b>${rows.length}</b> 场 · 按命中率排序（不按 EV，EV 最高的那注单独打角标）· 比分 4.0~40 倍且≥5% · 半全场只发 胜胜/平平/负负 且≥12% · 总进球≥10% 且不发 5 球档 · 概率 = 模型 40% + 盘口去水 60%${b.saleNote ? ' · ' + esc(b.saleNote) : ''}</span>
    </div>
    ${(b.showRows || []).some(r => /欧冠|欧罗巴|欧协联|亚冠/.test(r.leagueName || ''))
      ? '<div class="fn-warn">本日含欧战（欧冠/欧罗巴/欧协联/亚冠）场次：这类赛事球队本赛事样本少（门槛已放宽到 3 场），模型给的概率仍以「联赛均值+主场优势」为主，命中率无保证，仅供参考、谨慎下单。</div>'
      : ''}`;

  html += `<div class="mk-bar" id="milkPickBar">
    <span class="mk-count"></span>
    <span class="mk-pass">
      <span class="pl">过关</span>
      ${MILK_PASS_ALL.map(p => `<label class="${_milkPass.has(p) ? 'on' : ''}"><input type="checkbox" data-mkpass="${p}" ${_milkPass.has(p) ? 'checked' : ''} />${p}</label>`).join('')}
    </span>
    <span class="mk-acts">
      <button type="button" class="btn btn-ghost" data-milk-all="1">全选</button>
      <button type="button" class="btn btn-ghost" data-milk-none="1">清空</button>
      <button type="button" class="btn btn-primary" data-milk-fill="1" disabled>填入投注单</button>
    </span>
  </div>`;

  html += milkTicketHtml(b.milkTicket);

  // 战绩：台账（FbMilkPick）已结算的才进统计，未结算的单列一行提示。
  html += `<div class="milk-record" id="milkRecord"><div class="dim">大奶战绩加载中…</div></div>`;

  if(!rows.length){
    html += `<div class="empty">今天没有够格的大奶：比分要 4.0~40 倍且命中率≥5%，半全场只发 胜胜/平平/负负 且≥12%，总进球≥10%。门槛是按「能不能中」定的，宁缺毋滥。</div>`;
  } else {
    // 勾选按「注」算：同一场三列玩法各有各的选项和赔率，按场勾会混。
    // 每次重渲染都重建 data 表，勾选集合 _milkPickSet 保留，但要把本轮不存在的清理掉。
    _milkPickData = new Map();
    const aliveKeys = new Set();
    const cell = (g, play) => {
      const list = g.plays[play] || [];
      if(!list.length) return '<span class="dim">—</span>';
      return list.map(it => {
        const ev = Number(it.ev) || 0;
        const isEvTop = evTopKey != null && pickKey(it) === evTopKey;
        const evTopTag = isEvTop
          ? `<span class="opt-evtop" title="纯 EV 视角下今天最划算的一注（概率×赔率最高）。不是最可能中的那注，别当主推。">EV 最高</span>`
          : '';
        const mk = milkPickKey(it);
        aliveKeys.add(mk);
        _milkPickData.set(mk, it);
        const on = _milkPickSet.has(mk);
        // 返奖率直接标在每一注旁边：比分 71%、半全场/总进球 80%。
        // 以前只有 EV，用户看到 0.79 会以为是「算错了」；其实是这注已经接近该玩法的公平价了，
        // 天花板就是返奖率本身。EV 也在，但改成按「离公平价还差多少」上色。
        const pay = MILK_PAYOUT[play] || 0;
        const payTag = pay
          ? `<span class="opt-pay${pay < 0.75 ? ' costly' : ''}" title="竞彩${esc(MILK_PLAY_NAME[play] || play)}固定返奖率：每投 100 元，长期期望回收 ${Math.round(pay * 100)} 元。这是任何一注的天花板，EV 不可能到 1。">返奖 ${Math.round(pay * 100)}%</span>`
          : '';
        const evCls = pay && ev >= pay * 0.97 ? 'ev-fair' : 'ev-poor';
        // 逆市场角标（2026-11-05）：这注方向和竞彩市场最强方向相反，等于模型在跟整个市场对赌。
        // 市场方向占比过半的已经被引擎撤掉了，能留在这里的都是「市场没那么坚决」的弱背离。
        // 但该说的还得说：周四011 阿尔克马 vs 尤文图斯就是市场客胜 1.71、模型发「胜胜」，
        // EV 1.106 高得反常——那正是分歧大，不是价值大。
        const divTag = it.divergedFromMarket
          ? `<span class="opt-diverge" title="这一注的方向和市场最强方向相反：市场指${esc(it.marketDirectionName || '')} ${Number(it.marketDirectionPct || 0).toFixed(1)}%。EV 好看是因为模型跟市场分歧大，不是这注有价值。">逆市场 ${esc(it.marketDirectionName || '')} ${Number(it.marketDirectionPct || 0).toFixed(1)}%</span>`
          : '';
        // 纯模型角标（2026-11-05）：该玩法快照档数不全，引擎退回纯模型概率，没掺盘口。
        // 这类注的 EV 会系统性偏高，因为它少了市场那一半的约束——不标出来就像「挖到价值」。
        const modelOnlyTag = it.marketPriced === false
          ? `<span class="opt-modelonly" title="这场${esc(MILK_PLAY_NAME[play] || play)}的快照档数不全（比分 31 档 / 半全场 9 档 / 总进球 8 档），概率完全来自模型、没有掺盘口。这类 EV 天生偏高，别当成价值。">纯模型</span>`
          : '';
        return `<div class="opt-line${on ? ' mk-on' : ''}">
          <input type="checkbox" class="milk-pick" data-mk="${esc(mk)}" ${on ? 'checked' : ''} title="勾选这一注" />
          <b class="opt-name">${esc(it.option || '')}</b>
          <span class="opt-odds">@${Number(it.odds).toFixed(2)}</span>
          <span class="opt-prob">${Number(it.modelProbability).toFixed(1)}%</span>
          <span class="opt-ev ${evCls}" title="EV = 模型概率 × 赔率，也就是这注的长期回报。竞彩有水位，EV 最高只能到该玩法的返奖率，到不了 1。">EV ${ev.toFixed(2)}</span>${payTag}${divTag}${modelOnlyTag}${evTopTag}
        </div>`;
      }).join('');
    };

    html += `<div class="board-scroll"><table class="tbl rec-tbl milk-merged"><thead><tr>
        <th>场次</th><th>对阵</th><th>开赛</th>
        <th>${esc(MILK_PLAY_NAME.BF)}</th><th>${esc(MILK_PLAY_NAME.BQ)}</th><th>${esc(MILK_PLAY_NAME.JQ)}</th>
      </tr></thead><tbody>`;
    for(const g of rows){
      html += `<tr class="match-row">
        <td class="match-no">${esc(g.matchNo || '')}</td>
        <td class="teams-cell"><div class="teams">${esc(g.homeTeam || '')}<span class="vs">VS</span>${esc(g.awayTeam || '')}</div>
          <div class="league">${esc(g.leagueName || '')}</div></td>
        <td>${esc(tm(g.matchTime))}</td>
        <td>${cell(g, 'BF')}</td>
        <td>${cell(g, 'BQ')}</td>
        <td>${cell(g, 'JQ')}</td>
      </tr>`;
    }
    html += `</tbody></table></div>`;
    // 换日期/换筛选后旧勾选要清掉，否则会拿昨天的注往今天填
    for(const k of [..._milkPickSet]) if(!aliveKeys.has(k)) _milkPickSet.delete(k);
  }
  html += `</div>`;
  return html;
}

  const legs = (t.lines || []).map(l => `<tr>

        · 中奖率 ${t.chanceAnyPrize != null ? Number(t.chanceAnyPrize).toFixed(1) + '%' : '—'}
        · 回本率 ${t.chanceBackStake != null ? Number(t.chanceBackStake).toFixed(1) + '%' : '—'}

function bindPickCheckboxes(){
  document.querySelectorAll('input[data-pick]').forEach(inp => {
    inp.onchange = () => {
      const board = inp.getAttribute('data-pick');
      const kind = inp.getAttribute('data-kind');
      const mno = inp.getAttribute('data-mno');
      const map = _boardItemMap[board] || {};
      const it = kind === 'hcp' ? map['hcp:' + mno] : kind === 'draw' ? map['draw:' + mno] : map[mno];
      if(!it){ inp.checked = false; return; }
      const ok = setPick(board, kind, it, inp.checked);
      if(!ok){ inp.checked = false; return; }
      document.querySelectorAll(`input[data-pick="${board}"][data-kind="${kind}"][data-mno="${CSS.escape(mno)}"]`).forEach(el => {
        el.checked = inp.checked;
        el.closest('label')?.classList.toggle('on', inp.checked);
      });
      renderBetPickBar();
    };
  });
}

function passOptionsFor(n){
  const opts = [];
  const top = Math.min(n, 8);
  for(let k = 2; k <= top; k++) opts.push(k + '串1');
  return opts;
}

function getPassSet(board, kind){
  const key = board + '|' + kind;
  if(!_betPass[key]) _betPass[key] = new Set();
  return _betPass[key];
}

function selectedPassType(board, kind, n){
  const allowed = passOptionsFor(n);
  const set = getPassSet(board, kind);
  [...set].forEach(p => { if(!allowed.includes(p)) set.delete(p); });
  if(set.size === 0 && allowed.length){
    set.add('2串1');
    if(n === 3) set.add('3串1');
  }
  return allowed.filter(p => set.has(p));
}

let _sfcPicks = {};
let _sfcInited = {};
let _sfcMult = 1;

function sfcKey(it){ return `${it.expect || ''}|${it.matchNo}`; }

function ensureSfcDefaults(){
  const board = _boards.find(b => b.board === 'sfc');
  for(const it of (board && board.items) || []){
    const k = sfcKey(it);
    if(_sfcInited[k]) continue;
    _sfcInited[k] = true;
    _sfcPicks[k] = {};
    if(it.result === '3' || it.result === '1' || it.result === '0') _sfcPicks[k][it.result] = true;
  }
}

function sfcChosen(it){
  const b = _sfcPicks[sfcKey(it)] || {};
  return ['3','1','0'].filter(bit => b[bit]);
}

function sfcBitsHtml(it){
  const on = sfcChosen(it);
  const key = esc(sfcKey(it));
  return ['3','1','0'].map(bit => {
    const title = bit === '3' ? '主胜' : bit === '1' ? '平' : '客胜';
    return `<button type="button" class="sfc-bit ${on.includes(bit)?'on':''}" data-sfc-key="${key}" data-sfc-bit="${bit}" title="${title}">${bit}</button>`;
  }).join('');
}

function sfcToggle(key, bit){
  if(!_sfcPicks[key]) _sfcPicks[key] = {};
  if(_sfcPicks[key][bit]) delete _sfcPicks[key][bit];
  else _sfcPicks[key][bit] = true;
  _sfcInited[key] = true;
  renderBoards();
}

function bindSfcBits(){
  document.querySelectorAll('[data-sfc-bit]').forEach(btn => {
    btn.onclick = () => sfcToggle(btn.getAttribute('data-sfc-key'), btn.getAttribute('data-sfc-bit'));
  });
}

function sfcProduct(counts){
  if(counts.length !== 14) return 0;
  let p = 1;
  for(const c of counts){
    if(c < 1 || c > 3) return 0;
    p *= c;
  }
  return p;
}

function sfcRenjiu(counts){
  const n = counts.length;
  if(n < 9 || n > 14) return 0;
  if(counts.some(c => c < 1 || c > 3)) return 0;
  let sum = 0;
  function walk(start, left, prod){
    if(left === 0){ sum += prod; return; }
    for(let i = start; i <= n - left; i++) walk(i + 1, left - 1, prod * counts[i]);
  }
  walk(0, 9, 1);
  return sum;
}

function sfcSlip(){
  const board = _boards.find(b => b.board === 'sfc');
  const items = ((board && board.items) || []).slice().sort(officialMatchSort);
  const chosen = items.map(it => ({ it, bits: sfcChosen(it) })).filter(x => x.bits.length);
  const expects = [...new Set(chosen.map(x => String(x.it.expect || '')))];
  const mixed = expects.length > 1;
  const expect = expects.length === 1 ? expects[0] : '';
  const slate = expect ? items.filter(it => String(it.expect || '') === expect) : [];
  const full = !!expect && slate.length === 14 && chosen.length === slate.length
    && slate.every(it => sfcChosen(it).length > 0);
  return { items, chosen, expect, mixed, full };
}

function sfcOptionText(bits){
  const label = { '3':'胜', '1':'平', '0':'负' };
  return ['3','1','0'].filter(b => bits.includes(b)).map(b => label[b]).join(',');
}

function goSfcBet(play){
  const slip = sfcSlip();
  if(slip.mixed){ alert('一次只能买同一期'); return; }
  if(!slip.expect){ alert('没有期号，对不上 500.com'); return; }
  const counts = slip.chosen.map(x => x.bits.length);
  const fourteen = play === '胜负彩';
  const bets = fourteen ? (slip.full ? sfcProduct(counts) : 0) : sfcRenjiu(counts);
  if(!bets){
    alert(fourteen ? '胜负彩要 14 场都选，每场至少一个' : '任选九至少 9 场');
    return;
  }
  _pendingBetFill = {
    board: 'sfc',
    playType: play,
    passType: '',
    ticketKind: fourteen ? 'sfc-14' : 'sfc-rj',
    multiple: _sfcMult,
    expect: slip.expect,
    betAmount: bets * 2 * _sfcMult,
    lines: slip.chosen.map(x => ({
      matchNo: x.it.matchNo,
      home: x.it.homeTeam,
      away: x.it.awayTeam,
      handicap: '',
      option1: sfcOptionText(x.bits),
      option2: '',
      odds1: '', odds2: ''
    }))
  };
  switchTab('mybets');
}

/** 「胜负」勾选 = 不让球胜平负（红字方向）；不用让胜/让平/让负 */
function toPlainSpf(opt){
  if(!opt) return '';
  return String(opt).replace(/让/g, '').replace('主胜', '胜').replace('客胜', '负').replace('主负', '负').trim();
}
function spfOptionFromItem(it){
  const map = {'3':'胜','1':'平','0':'负'};
  if(it.result && map[it.result]) return map[it.result];
  if(it.resultText === '主胜') return '胜';
  if(it.resultText === '客胜') return '负';
  if(it.resultText === '平局') return '平';
  return it.resultText || '';
}

function pagePlayOdds(matchNo, playType, label){
  if(!matchNo || label == null || label === '') return '';
  const want = oddsSide(label);
  const norm = String(label).replace(/\s/g, '');
  const cells = document.querySelectorAll('.water[data-mno]');
  for(const el of cells){
    if(el.getAttribute('data-mno') !== String(matchNo)) continue;
    const groups = el._jc && el._jc.groups;
    const g = groups && groups.find(x => x.playType === playType);
    let hit = null;
    if(g && g.options){
      if(playType === 'SPF' || playType === 'NSPF'){
        if(want >= 0) hit = g.options.find(o => oddsSide(o.name) === want);
      }else{
        hit = g.options.find(o => String(o.name || '').replace(/\s/g, '') === norm);
      }
    }
    if(hit && hit.odds != null && hit.odds !== ''){
      const n = Number(hit.odds);
      if(Number.isFinite(n) && n > 1) return n.toFixed(2);
    }
    if(playType === 'SPF' && want >= 0 && el._euro && el._euro.latestSpf){
      const s = el._euro.latestSpf;
      const v = want === 0 ? s.home : want === 1 ? s.draw : s.away;
      const n = Number(v);
      if(Number.isFinite(n) && n > 1) return n.toFixed(2);
    }
  }
  return '';
}

function oddsForPick(it, kind){
  const mno = it.matchNo;
  if(kind === 'score'){
    const scores = it.scores || [];
    return { odds1: pagePlayOdds(mno, 'BF', scores[0]), odds2: pagePlayOdds(mno, 'BF', scores[1]) };
  }
  if(kind === 'hcp'){
    const live = pagePlayOdds(mno, 'NSPF', it.resultText || '');
    const fallback = it.handicapOdds != null ? Number(it.handicapOdds).toFixed(2) : '';
    return { odds1: live || fallback, odds2: '' };
  }
  if(kind === 'draw') return { odds1: pagePlayOdds(mno, 'SPF', '平'), odds2: '' };
  return { odds1: pagePlayOdds(mno, 'SPF', spfOptionFromItem(it)), odds2: '' };
}

function goBetFromPicks(board, kind){
  const items = listPicks(board, kind);
  if(items.length === 0){ alert('请先勾选场次'); return; }
  const n = items.length;
  let passes = selectedPassType(board, kind, n);
  if(n >= 2 && passes.length === 0){
    alert('请至少勾选一种过关方式（2串1 到 8串1）');
    return;
  }
  const passType = passes.join('#');
  const isScore = kind === 'score';
  const isHcp = kind === 'hcp';
  const isDraw = kind === 'draw';
  // 勾选「胜负」和「平局」都记胜平负。勾选「让球」才记让球胜平负。勾选「比分」记全场比分。
  const playType = isScore ? '全场比分' : isHcp ? '让球胜平负' : '胜平负';
  const ticketKind = board === 'bd'
    ? (isScore ? 'bd-score' : 'bd-spf')
    : (isScore ? 'jc-score' : 'jc-spf');

  _pendingBetFill = {
    board, playType, passType, ticketKind, multiple: 1,
    lines: items.map(it => {
      const scores = it.scores || [];
      const priced = oddsForPick(it, kind);
      return {
        matchNo: it.matchNo,
        home: it.homeTeam,
        away: it.awayTeam,
        handicap: isHcp ? (it.handicap != null ? String(it.handicap) : '')
          : (board === 'bd' && !isScore && it.handicap != null ? String(it.handicap) : ''),
        option1: isScore ? (scores[0] || '') : isDraw ? '平' : isHcp ? (it.resultText || '') : spfOptionFromItem(it),
        option2: isScore ? (scores[1] || '') : '',
        odds1: priced.odds1, odds2: priced.odds2
      };
    })
  };

  switchTab('mybets');
}

/* ============ 水位变化（胜平负三线 + 必发成交量）============ */

// 箭头：涨红↑、跌绿↓、平灰—
function arrow(delta, digits){
  if(delta == null) return '<span class="arrow-flat">—</span>';
  const d = Number(delta);
  const txt = d.toFixed(digits||2);
  if(d > 0) return `<span class="arrow-up">↑${txt}</span>`;
  if(d < 0) return `<span class="arrow-down">↓${Math.abs(d).toFixed(digits||2)}</span>`;
  return '<span class="arrow-flat">→0.00</span>';
}

function oddsSide(name){
  const n = String(name || '');
  if(n.includes('平')) return 1;
  if(n.includes('负') || n.includes('客')) return 2;
  if(n.includes('胜') || n.includes('主')) return 0;
  return -1;
}

function oddsMove(delta, digits){
  if(delta == null) return '<span class="ob-ar fl">—</span>';
  const d = Number(delta);
  const n = Math.abs(d).toFixed(digits == null ? 2 : digits);
  if(d > 0) return `<span class="ob-ar up">↑${n}</span>`;
  if(d < 0) return `<span class="ob-ar dn">↓${n}</span>`;
  const z = (0).toFixed(digits == null ? 2 : digits);
  return `<span class="ob-ar fl">→${z}</span>`;
}

function oddsMark(delta){
  if(delta == null) return '<span class="ob-ar"></span>';
  const d = Number(delta);
  if(d > 0) return '<span class="ob-ar up">↑</span>';
  if(d < 0) return '<span class="ob-ar dn">↓</span>';
  return '<span class="ob-ar fl">→</span>';
}

function paintOdds(el){
  const euro = el._euro;
  const jc = el._jc;
  const s = euro && euro.latestSpf;
  const ex = euro && euro.latestExchange;
  const groups = jc && jc.groups ? jc.groups : [];
  const nspf = groups.find(g => g.playType === 'NSPF');
  const spf = groups.find(g => g.playType === 'SPF');
  const others = groups.filter(g => g.playType !== 'NSPF' && g.playType !== 'SPF');

  const trio = (options) => {
    const cols = [null, null, null];
    (options || []).forEach(o => {
      const i = oddsSide(o.name);
      if(i >= 0 && !cols[i]) cols[i] = o;
    });
    return cols;
  };
  const numCell = (o, withMark) => {
    const mark = withMark === 'num' ? oddsMove(o && o.delta) : withMark ? oddsMark(o && o.delta) : '<span class="ob-ar"></span>';
    if(!o || o.odds == null || o.odds === '') return `<span class="ob-cell"><span class="ob-n">—</span>${mark}</span>`;
    return `<span class="ob-cell"><span class="ob-n">${o.odds}</span>${mark}</span>`;
  };
  const line = (label, options, withMark) => {
    const cols = trio(options);
    if(cols.every(c => !c)) return '';
    return `<span class="ob-lab">${label}</span>` + cols.map(o => numCell(o, withMark)).join('');
  };

  let rows = '';
  if(spf) rows += line('胜平负', spf.options, true);
  const hcp = hcpLine(el.getAttribute('data-hcp'));
  if(nspf) rows += line(hcp ? '让球 ' + hcp : '让球', nspf.options, true);
  if(s){
    if(nspf || spf) rows += '<span class="ob-rule"></span>';
    rows += line('欧赔', [
      {name:'胜', odds:s.home, delta:s.homeDelta},
      {name:'平', odds:s.draw, delta:s.drawDelta},
      {name:'负', odds:s.away, delta:s.awayDelta}
    ], 'num');
  }

  let meta = '';
  if(ex){
    const vol = ex.totalVolume != null ? (ex.totalVolume >= 10000 ? (ex.totalVolume / 10000).toFixed(1) + '万' : ex.totalVolume) : '—';
    meta += `<div class="ob-meta">成交 ${vol}</div>`;
  }
  if(others.length){
    let changed = 0;
    others.forEach(g => (g.options || []).forEach(o => { if(o.delta) changed++; }));
    const title = esc(others.map(g => (g.options || []).map(o => o.name + ':' + o.odds).join(' ')).join('  '));
    meta += `<div class="ob-meta" title="${title}">其他 ${others.length} 类，变动 ${changed}</div>`;
  }
  const stamp = (jc && jc.capturedAt) || (s && s.capturedAt);
  const time = stamp ? new Date(stamp).toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'}) : '';

  if(!rows && !meta){
    el.innerHTML = '<span class="water-loading">暂无采样</span>';
    return;
  }
  const board = rows
    ? `<div class="odds-board"><span></span><span class="ob-h">胜</span><span class="ob-h">平</span><span class="ob-h">负</span>${rows}</div>`
    : '';
  el.innerHTML = board + meta + (time ? `<div class="ob-time">@${time}</div>` : '');
}

function renderWaterCell(el, w){
  el._euro = w || null;
  paintOdds(el);
}

let _waterLoading = false;
async function loadWater(){
  const cells = document.querySelectorAll('.water[data-mid]');
  if(cells.length === 0) return;
  _waterLoading = true;
  const mids = new Set();
  cells.forEach(c => { const m = c.getAttribute('data-mid'); if(m) mids.add(m); });

  const results = {};
  // 并发但限流，避免一次性打爆接口
  const ids = [...mids];
  await Promise.all(ids.map(async (mid) => {
    try{
      const w = await api('/api/football/water/' + mid);
      results[mid] = w;
    }catch(e){ results[mid] = null; }
  }));

  // 重新查询 DOM（可能已因筛选重渲染），按 mid 填充
  cells.forEach(c => {
    const m = c.getAttribute('data-mid');
    if(m && results[m]) renderWaterCell(c, results[m]);
    else if(m) renderWaterCell(c, null);
  });
  _waterLoading = false;
}

const JC_PLAY_NAME = {'NSPF':'让球胜平负','SPF':'胜平负','BF':'比分','JQ':'总进球','BQ':'半全场'};

// 渲染竞彩固定奖金水位：让球胜平负 + 胜平负 显示赔率+涨跌箭头，比分/总进球/半全场折叠
function renderJcWater(el, w){
  if(!w || !w.groups || w.groups.length === 0) return;
  el._jc = w;
  paintOdds(el);

async function loadJcWater(){
  const cells = document.querySelectorAll('.water[data-mno]');
  if(cells.length === 0) return;
  const mnos = new Set();
  cells.forEach(c => { const m = c.getAttribute('data-mno'); if(m) mnos.add(m); });

  const results = {};
  await Promise.all([...mnos].map(async (mno) => {
    try{
      const w = await api('/api/football/jc-water/' + encodeURIComponent(mno));
      results[mno] = w;
    }catch(e){ results[mno] = null; }
  }));

  cells.forEach(c => {
    const m = c.getAttribute('data-mno');
    if(m && results[m]) renderJcWater(c, results[m]);
  });
}

/* 把 /api/lotto/tickets 的票按期号并进复盘 issues；复盘没有的期补一个纯选号器的期 */
function mergeUserTickets(review, ut){
  if(!review || !ut || !(ut.issues || []).length) return;
  const isDigit = ['fc3d','pl3','pl5'].includes(String(review.lotteryCode || '').toLowerCase());
  const map = new Map((review.issues || []).map(i => [String(i.issue), i]));
  for(const u of ut.issues){
    const key = String(u.issue || '');
    const target = map.get(key);
    if(target){
      target.userTickets = u.tickets || [];
    }else{
      const ni = { issue: u.issue, settled: !!u.settled, draw: u.draw || null, picks: [], userTickets: u.tickets || [] };
      if(isDigit && ni.draw && (ni.draw.reds || []).length)
        ni.draw.places = ni.draw.reds.length >= 5 ? ['万','千','百','十','个'] : ['百','十','个'];
      (review.issues = review.issues || []).push(ni);
      map.set(key, ni);
    }
  }
  review.issues.sort((a, b) => {
    const x = parseInt(a.issue, 10), y = parseInt(b.issue, 10);
    if(Number.isFinite(x) && Number.isFinite(y) && x !== y) return y - x;
    return String(b.issue).localeCompare(String(a.issue));
  });
}

function renderLottoReview(){
  const box = $('#lottoBoard');
  const data = _lottoReview;
  if(!data || !(data.issues || []).length){
    box.innerHTML = `<div class="empty">还没有保存过这期选号。先生成并保存，开奖后再来对。</div>`;
    return;
  }
  const isDigit = ['fc3d','pl3','pl5'].includes((data.lotteryCode || '').toLowerCase());
  const placeRule = isDigit
    ? '排列三、排列五、福彩3D 按位对。三位是百、十、个，五位是万、千、百、十、个。同一位对上才标「中」。'
    : '开出来的号标「中」。乐透按号码，四胆全拖只标胆和后区。';
  let html = `<p class="lotto-review-head"><b>${esc(data.lotteryName || '')}</b> · 对照已保存的选号和选号器保存的票，按开奖日期分组。${placeRule}</p>`;

  const pending = (data.issues || []).filter(i => !i.settled);
  const drawn = (data.issues || []).filter(i => i.settled);

  // 当期（最新已开奖期）之后的期还没开奖：默认折叠
  if(pending.length){
    html += `<details class="lotto-fold lotto-fold-pending"><summary>待开奖 · ${pending.length} 期（点开展开）</summary><div class="lotto-fold-body">`;
    for(const issue of pending) html += lottoIssueHtml(issue, isDigit);
    html += `</div></details>`;
  }

  const groups = [];
  for(const issue of drawn){
    const d = (issue.draw && issue.draw.drawDate) || '';
    if(!groups.length || groups[groups.length - 1].date !== d) groups.push({ date: d, items: [] });
    groups[groups.length - 1].items.push(issue);
  }
  for(let gi = 0; gi < groups.length; gi++){
    const g = groups[gi];
    // 只有最近一个开奖日默认展开，更早的都收起
    html += `<details class="lotto-fold"${gi === 0 ? ' open' : ''}><summary>${esc(g.date || '已开奖')} · ${g.items.length} 期</summary><div class="lotto-fold-body">`;
    for(const issue of g.items) html += lottoIssueHtml(issue, isDigit);
    html += `</div></details>`;
  }
  if(!drawn.length) html += `<div class="empty">还没有已开奖的期</div>`;
  box.innerHTML = html;
}

function lottoIssueHtml(issue, isDigit){
  let html = `<section class="lotto-issue"><h3>第 ${esc(issue.issue || '')} 期`;
  if(issue.settled && issue.draw) html += `<span>${esc(issue.draw.drawDate || '')}</span>`;
  else html += `<span>还没开奖</span>`;
  html += `</h3>`;
  if(issue.settled && issue.draw){
    html += `<div class="lotto-draw"><div class="ld-title">开奖<span>${isDigit ? '按位对上的标「中」' : '标「中」的是这期推荐里开出来的号'}</span></div>
      ${placeRow(issue.draw.places)}
      <div class="lotto-balls">${markedBalls(issue.draw.reds, issue.draw.blues, isDigit)}</div></div>`;
  }
  for(const p of issue.picks || []){
    html += `<div class="lotto-card ${p.isPrimary ? 'primary' : ''} ${(p.playType || '') === '四胆全拖' ? 'dantuo' : ''}">
      <div class="lc-head">
        <span class="lc-rank">${p.isPrimary ? '<span class="feat-tag strong-tag">主推</span>' : ((p.playType || '') === '四胆全拖' ? '<span class="feat-tag">四胆全拖</span>' : '备选 ' + p.rankNo)}</span>
        <span class="lc-play">${esc(p.playType || '')}</span>
        <span class="lc-score">${esc(p.note || '')}</span>
      </div>
      ${isDigit ? placeRow(issue.draw && issue.draw.places) : ''}
      <div class="lotto-balls">${markedBalls(p.reds, p.blues, isDigit)}</div>
    </div>`;
  }
  for(const t of issue.userTickets || []) html += userTicketCard(t, issue, isDigit);
  html += `</section>`;
  return html;
}

/* 选号器保存的票：来源 + 玩法 + 对奖说明 */
function userTicketCard(t, issue, isDigit){
  const src = t.source === 'pick' ? '避热门选号器' : (t.source === 'user' ? '手输' : (t.source || '我的票'));
  return `<div class="lotto-card userticket">
    <div class="lc-head">
      <span class="lc-rank"><span class="feat-tag">${esc(src)}</span></span>
      <span class="lc-play">${esc(t.playType || '')}${t.betAmount ? ` · ${Number(t.betAmount).toFixed(0)} 元` : ''}</span>
      <span class="lc-score">${esc(t.note || '')}</span>
    </div>
    ${isDigit ? placeRow(issue.draw && issue.draw.places) : ''}
    <div class="lotto-balls">${markedBalls(t.reds, t.blues, isDigit)}</div>
  </div>`;
}

function placeRow(places){
  if(!places || !places.length) return '';
  return `<div class="lotto-places">${places.map(p => `<span>${esc(p)}</span>`).join('')}</div>`;
}

function markedBalls(reds, blues, isDigit){
  const one = (b, digit) => {
    const n = b && typeof b === 'object' ? b.n : b;
    const hit = !!(b && b.hit);
    const text = digit ? n : String(n).padStart(2, '0');
    return `<span class="ball ${digit ? 'ball-digit' : 'ball-red'}${hit ? ' hit' : ''}">${text}</span>`;
  };
  const blue = b => {
    const n = b && typeof b === 'object' ? b.n : b;
    const hit = !!(b && b.hit);
    return `<span class="ball ball-blue${hit ? ' hit' : ''}">${String(n).padStart(2,'0')}</span>`;
  };
  const r = (reds || []).map(b => one(b, isDigit)).join('');
  const u = (blues || []).map(blue).join('');
  return r + (u ? '<span style="width:8px"></span>' + u : '');
}

function renderLotto(){
  const reviewBtn = $('#lottoReview');
  if(reviewBtn) reviewBtn.style.outline = '';
  const box = $('#lottoBoard');
  if(!_lottoData || !_lottoData.boards){
    box.innerHTML = `<div class="empty">暂无数字彩方案，可点「重新生成并保存」</div>`;
    return;
  }
  const board = (_lottoData.boards || []).find(b => (b.lotteryCode || '').toLowerCase() === _lottoCode)
    || _lottoData.boards[0];
  if(!board){ box.innerHTML = `<div class="empty">暂无数据</div>`; return; }

  const isDigit = ['fc3d','pl3','pl5'].includes((board.lotteryCode || '').toLowerCase());
  let html = `<div class="lotto-meta"><b>${esc(board.lotteryName || '')}</b>
    · 目标期 <b>${esc(board.targetIssue || '—')}</b>
    · 基于 <b>${esc(board.basedOnIssue || '—')}</b> 期
    · ${esc(board.summary || '')}</div>`;

  const picks = board.picks || [];
  if(picks.length === 0){
    html += `<div class="empty">该彩种暂无方案</div>`;
    box.innerHTML = html;
    return;
  }
  const danTuo = picks.find(p => (p.playType || '') === '四胆全拖');
  const singles = picks.filter(p => (p.playType || '') !== '四胆全拖');
  for(const p of singles){
    html += `<div class="lotto-card ${p.isPrimary ? 'primary' : ''}">
      <div class="lc-head">
        <span class="lc-rank">${p.isPrimary ? '<span class="feat-tag strong-tag">主推</span>' : '备选 ' + p.rankNo}</span>
        <span class="lc-play">${esc(p.playType || '')}</span>
        <span class="lc-score">评分 ${p.score != null ? Number(p.score).toFixed(1) : '—'}</span>
      </div>
      <div class="lotto-balls">${lottoBallsHtml(p.reds, p.blues, isDigit)}</div>
      <div class="lotto-desc">${esc(p.signalDesc || '')}</div>
    </div>`;
  }
  if(danTuo) html += renderDanTuo(danTuo);

  // 推荐号码后面跟最新开奖结果
  const draw = board.lastDraw;
  if(draw){
    html += `<div class="lotto-draw">
      <div class="ld-title">开奖结果<span>第 ${esc(draw.issue || '')} 期 · ${esc(draw.drawDate || '')}</span></div>
      <div class="lotto-balls">${lottoBallsHtml(draw.reds, draw.blues, isDigit)}</div>
    </div>`;
  }else{
    html += `<div class="lotto-draw"><div class="ld-title">开奖结果<span>暂无</span></div></div>`;
  }
  box.innerHTML = html;
}

function renderDanTuo(p){
  const tuo = p.tuoReds || [];
  const bets = p.betCount != null ? p.betCount : tuo.length;
  const tuoHtml = tuo.map(n => `<span class="ball ball-tuo">${String(n).padStart(2,'0')}</span>`).join('');
  return `<div class="lotto-card dantuo">
    <div class="lc-head">
      <span class="lc-rank"><span class="feat-tag">四胆全拖</span></span>
      <span class="lc-play">前区 4 胆 + ${tuo.length} 拖，后区定 2 个</span>
      <span class="lc-score">${bets} 注 · 评分 ${p.score != null ? Number(p.score).toFixed(1) : '—'}</span>
    </div>
    <div class="lotto-sub">前区胆，每注都带</div>
    <div class="lotto-balls">${lottoBallsHtml(p.reds, [], false)}</div>
    <div class="lotto-sub">前区拖，全拖 ${tuo.length} 个</div>
    <div class="lotto-balls">${tuoHtml}</div>
    <div class="lotto-sub">后区定码</div>
    <div class="lotto-balls">${lottoBallsHtml([], p.blues, false)}</div>
    <div class="lotto-desc">${esc(p.signalDesc || '')}</div>
  </div>`;
}

function lottoBallsHtml(reds, blues, isDigit){
  const r = (reds || []).map(n =>
    `<span class="ball ${isDigit ? 'ball-digit' : 'ball-red'}">${isDigit ? n : String(n).padStart(2,'0')}</span>`
  ).join('');
  const b = (blues || []).map(n =>
    `<span class="ball ball-blue">${String(n).padStart(2,'0')}</span>`
  ).join('');
  return r + (b ? '<span style="width:8px"></span>' + b : '');
}

function parseCron(cron){
  const p = String(cron || '').trim().split(/\s+/);
  if(p.length !== 5 || p[2] !== '*' || p[3] !== '*' || p[4] !== '*') return {kind:'raw', cron};
  const [min, hour] = p;
  if(min === '*' && hour === '*') return {kind:'interval', every:1};
  if(min.startsWith('*/') && hour === '*') return {kind:'interval', every:Number(min.slice(2))};
  if(hour === '*') return {kind:'hourly', minutes:min.split(',').map(x => x.trim()).filter(Boolean)};
  const hours = hour.split(',').map(x => x.trim()).filter(Boolean);
  const mm = String(min).padStart(2,'0');
  return {kind:'daily', times:hours.map(h => `${String(h).padStart(2,'0')}:${mm}`)};
}
function buildCron(card){
  const kind = card.dataset.kind;
  if(kind === 'raw') return card.querySelector('[data-raw]').value.trim();
  if(kind === 'interval'){
    const n = Math.max(1, Math.round(Number(card.querySelector('[data-every]').value) || 1));
    return n === 1 ? '* * * * *' : `*/${n} * * * *`;
  }
  if(kind === 'hourly'){
    const mins = card.querySelector('[data-minutes]').value.split(/[,，\s]+/).map(x => String(Math.min(59, Math.max(0, Number(x))))).filter(x => x !== 'NaN');
    if(!mins.length) return '';
    return [...new Set(mins)].join(',') + ' * * * *';
  }
  const times = [...card.querySelectorAll('[data-time]')].map(el => el.value).filter(Boolean);
  if(!times.length) return '';
  const minutes = new Set(times.map(t => t.slice(3,5).replace(/^0/, '') || '0'));
  if(minutes.size !== 1) return '';
  const hours = [...new Set(times.map(t => String(Number(t.slice(0,2)))))].sort((a,b) => a-b);
  return `${[...minutes][0]} ${hours.join(',')} * * *`;
}
function fmtNext(v){
  if(!v) return '未排期';
  const d = new Date(v);
  if(Number.isNaN(d.getTime())) return String(v).replace('T',' ').slice(0,16);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function jobEditor(job){
  const form = parseCron(job.cron);
  if(form.kind === 'interval') return `<label>每隔</label><input data-every type="number" min="1" max="59" value="${form.every}" /> <span>分钟</span>`;
  if(form.kind === 'hourly') return `<label>每小时的第</label><input data-minutes type="text" value="${form.minutes.join(',')}" /> <span>分钟，多个用逗号</span>`;
  if(form.kind === 'daily'){
    const times = form.times.map(t => `<input data-time type="time" value="${t}" />`).join('');
    return `<label>每天</label><span data-times>${times}</span><button type="button" data-add-time>加一个时间</button>`;
  }
  return `<label>cron</label><input data-raw type="text" value="${esc(job.cron)}" />`;
}

async function saveJob(name){
  const card = document.querySelector(`.job-card[data-name="${name}"]`);
  const msg = card.querySelector('[data-msg]');
  const cron = buildCron(card);
  if(!cron){ msg.className = 'msg bad'; msg.textContent = '时间没填对。一天里多个时间的分钟要相同。'; return; }
  const body = { cron, enabled: card.querySelector('[data-enabled]').checked };
  const hours = card.querySelector('[data-hours]');
  const gap = card.querySelector('[data-gap]');
  if(hours) body.hours = Number(hours.value);
  if(gap) body.recheckMinutes = Number(gap.value);
  msg.className = 'msg';
  msg.textContent = '保存中…';
  try{
    const res = await api('/api/jobs/' + encodeURIComponent(name), {method:'PUT', body:JSON.stringify(body)});
    if(res.ok === false){ msg.className = 'msg bad'; msg.textContent = res.message || '保存失败'; return; }
    await loadJobs();
  }catch(e){
    msg.className = 'msg bad';
    msg.textContent = e.message || '保存失败';
  }
}

function statsOfPurchases(items){
  const total = items.length;
  const won = items.filter(p => p.status === 'WON').length;
  const totalBet = items.reduce((s,p) => s + Number(p.betAmount || 0), 0);
  const totalWin = items.reduce((s,p) => s + Number(p.actualWin || 0), 0);
  return {
    totalPurchases: total,
    wonPurchases: won,
    winRate: total ? Math.round(won * 1000 / total) / 10 : 0,
    totalBet,
    totalWin
  };
}

async function fillLineTeams(tr, no){

  if(local) applyLineTeams(tr, local.homeTeam || local.home, local.awayTeam || local.away);

    if(expect) q.set('expect', expect);
