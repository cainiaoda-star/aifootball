// 行级玩法（用户 2026-11-04 定）：只录大奶三玩法；胜平负仅兼容旧填入路径时出现
const LINE_PLAYS = ['比分', '半全场', '总进球数'];

// 票面级玩法名 → 行级玩法
function normTicketPlay(s){
  const t = String(s || '');
  if(t.includes('比分')) return '比分';
  if(t.includes('半全')) return '半全场';
  if(t.includes('进球')) return '总进球数';
  if(t.includes('胜平负') || t.includes('让球')) return '胜平负';
  return '';
}

// 选项形态 → 行级玩法
function inferPlayFromOption(opt){
  const t = String(opt || '').trim();
  if(!t) return '';
  if(/^\d{1,2}:\d{1,2}$/.test(t) || /(胜其它|平其它|负其它)$/.test(t)) return '比分';
  if(/^[胜平负]{2}$/.test(t) || /^[胜平负]\/[胜平负]$/.test(t)) return '半全场';
  if(/^让[胜平负]$/.test(t) || /^[胜平负]$/.test(t)) return '胜平负';
  if(/^[0-9]$/.test(t)) return '总进球数';
  return '';
}

/* 场次/对阵同值合并：同一场连续多行时，前两列用 rowspan 合并显示。
   被吞掉的行删掉自己的前两个 td，取值走 lineVal（优先分组头行的实时值）。 */
const _lineSwallow = new WeakMap(); // tr -> [td场次, td对阵]

function lineVal(tr, sel){
  const el = tr.querySelector(sel);
  if(el) return el.value;
  const head = tr._mergeHead;
  if(head){
    const h = head.querySelector(sel);
    if(h) return h.value;
  }
  return tr._mergeVals ? (tr._mergeVals[sel] || '') : '';
}

function unmergeLineCells(){
  document.querySelectorAll('#nbLines tr').forEach(tr => {
    const m = _lineSwallow.get(tr);
    if(m){
      if(m[0]) tr.insertBefore(m[0], tr.firstChild);
      if(m[1] && m[0]) tr.insertBefore(m[1], m[0].nextSibling);
      _lineSwallow.delete(tr);
      tr._mergeHead = null;
      tr._mergeVals = null;
    } else {
      tr.querySelectorAll('td').forEach(td => td.rowSpan = 1);
    }
  });
}

function mergeLineCells(){
  unmergeLineCells();
  const trs = [...document.querySelectorAll('#nbLines tr')];
  let i = 0;
  while(i < trs.length){
    const no = (trs[i].querySelector('.l-no')?.value || '').trim();
    let j = i + 1;
    if(no){
      while(j < trs.length && (trs[j].querySelector('.l-no')?.value || '').trim() === no) j++;
    }
    const span = j - i;
    if(span > 1){
      const tdNo = trs[i].children[0], tdVs = trs[i].children[1];
      if(tdNo && tdVs){
        tdNo.rowSpan = span;
        tdVs.rowSpan = span;
        for(let k = i + 1; k < j; k++){
          const tr = trs[k];
          const a = tr.children[0], b = tr.children[1];
          tr._mergeVals = { '.l-no': no, '.l-vs': (trs[i].querySelector('.l-vs')?.value || '') };
          tr._mergeHead = trs[i];
          if(a) tr.removeChild(a);
          if(b) tr.removeChild(b);
          _lineSwallow.set(tr, [a, b]);
        }
      }
    }
    i = j;
  }
}

function removeLine(btn){
  btn.closest('tr').remove();
  mergeLineCells();
  updateLineHits();
}

function addLineRow(pre){
  // 旧契约（一行两注 option1/option2）拆成两行，一注一行
  if(pre && pre.option == null && (pre.option1 || pre.option2 || pre.odds1 != null || pre.odds2 != null)){
    const { option1, odds1, option2, odds2, ...rest } = pre;
    addLineRow({ ...rest, option: option1 || '', odds: odds1 });
    if(option2 || odds2 != null) addLineRow({ ...rest, option: option2 || '', odds: odds2 });
    return;
  }
  const tr = document.createElement('tr');
  const v = (x) => x == null ? '' : x;
  let play = pre?.play || inferPlayFromOption(pre?.option) || normTicketPlay($('#nbPlay')?.value);
  if(!LINE_PLAYS.includes(play)) play = '比分';
  const plays = play === '胜平负' ? ['胜平负', ...LINE_PLAYS] : LINE_PLAYS;
  const vs = (pre?.home || pre?.away) ? `${v(pre?.home)} vs ${v(pre?.away)}` : '';
  tr.innerHTML = `<td><input class="l-no" placeholder="周三001" value="${v(pre?.matchNo)}" /></td>
    <td><input class="l-vs" placeholder="主队 vs 客队" style="min-width:170px" value="${vs}" /></td>
    <td><select class="l-play">${plays.map(p => `<option${p === play ? ' selected' : ''}>${p}</option>`).join('')}</select></td>
    <td><input class="l-o" placeholder="比分 2:1 / 半全场 胜胜 / 总进球 4" style="min-width:130px" value="${v(pre?.option)}" /></td>
    <td><input class="l-od" placeholder="赔率" style="width:70px" value="${v(pre?.odds)}" /></td>
    <td class="l-hit b-meta">—</td>
    <td><button class="rm-btn" onclick="removeLine(this)">删</button></td>`;
  const noInput = tr.querySelector('.l-no');
  let timer = 0;
  const schedule = () => {
    clearTimeout(timer);
    const no = noInput.value.trim();
    if(!matchNoReady(no)) return;
    timer = setTimeout(() => fillLineTeams(tr, no), 280);
  };
  noInput.addEventListener('input', schedule);
  noInput.addEventListener('change', () => { mergeLineCells(); fillLineTeams(tr, noInput.value.trim()); });
  tr.querySelector('.l-vs').addEventListener('input', e => { delete e.target.dataset.auto; });
  tr.querySelector('.l-vs').addEventListener('change', mergeLineCells);
  tr.querySelector('.l-od').addEventListener('input', updateLineHits);
  $('#nbLines').appendChild(tr);
  mergeLineCells();
}

/** 每行命中率（赔率反推）+ 票面过关命中率估算 */
function updateLineHits(){
  const trs = [...document.querySelectorAll('#nbLines tr')];
  const rows = trs.map(tr => {
    const od = parseFloat(tr.querySelector('.l-od')?.value);
    const opt = (tr.querySelector('.l-o')?.value || '').trim();
    return {
      no: lineVal(tr, '.l-no').trim(),
      has: !!opt || (Number.isFinite(od) && od > 0),
      p: Number.isFinite(od) && od > 1 ? 1 / od : null
    };
  });
  rows.forEach((r, i) => {
    const cell = trs[i].querySelector('.l-hit');
    if(cell) cell.textContent = r.p != null ? (r.p * 100).toFixed(1) + '%' : '—';
  });
  const el = $('#nbProb');
  if(!el) return;
  const valid = rows.filter(r => r.p != null);
  if(!valid.length){ el.textContent = ''; return; }
  // 同一场多注（复式）按场次合并；没有场次号的行各自算一场
  const groups = new Map();
  valid.forEach((r, i) => {
    const key = r.no || ('row' + i);
    groups.set(key, Math.min(0.999, (groups.get(key) || 0) + r.p));
  });
  const ps = [...groups.values()];
  const pass = ($('#nbPass')?.value || '').trim();
  const passes = pass.split('#').map(s => s.trim()).filter(s => /^(单关|\d)串?1?$/.test(s) && s !== '1').map(s => s === '单关' ? 1 : parseInt(s));
  const pct = x => (Math.min(1, x) * 100).toFixed(1) + '%';
  let text = `全不中 ≈ ${pct(1 - ps.reduce((a, p) => a * (1 - p), 1))}`;
  for(const k of passes){
    if(ps.length < k) continue;
    let p = 0;
    for(const c of kCombinations([...ps.keys()], k)) p += c.reduce((a, i) => a * ps[i], 1);
    text += ` · ${k === 1 ? '单关' : k + '串1'} ≈ ${pct(p)}`;
  }
  if(!passes.length) text += ` · 至少中一注 ≈ ${pct(1 - ps.reduce((a, p) => a * (1 - p), 1))}`;

  // 注数/金额：同场多行=复式，k串1 注数 = Σ(各 k 场组合的选项数连乘)；单注 2 元 × 倍数
  const counts = new Map();
  rows.forEach((r, i) => {
    if(!r.has) return;
    const key = r.no || ('row' + i);
    counts.set(key, (counts.get(key) || 0) + 1);
  });
  const cs = [...counts.values()];
  const mult = parseInt($('#nbMult')?.value) || 1;
  let bets = 0;
  if(passes.length){
    for(const k of passes) bets += comboBets(cs, k);
  } else {
    bets = cs.reduce((a, c) => a + c, 0); // 没填过关方式：按每行一注单关
  }
  if(bets > 0){
    const amount = bets * 2 * mult;
    text += ` · 共 ${bets} 注` + (mult > 1 ? ` × ${mult} 倍` : '') + ` = ${(bets * 2)}×${mult}=${amount} 元`;
    const amt = $('#nbAmount');
    if(amt && document.activeElement !== amt) amt.value = amount;
  }

  // 预计中奖（竞彩官方口径 = 最理想且自洽剧本）：同场互斥选项不可能同时中
  // （2:2 与 负负、2:1 与 2球），能同中的才叠加（2:1 + 胜胜）。
  // 每场先求自洽选项集合的最大赔率和 S，k 串1 剧本奖金 = Σ(任取 k 场的 S 连乘)；单关 = Σ S。
  const optGroups = new Map();
  rows.forEach((r, i) => {
    const od = parseFloat(trs[i].querySelector('.l-od')?.value);
    if(!(Number.isFinite(od) && od > 1)) return;
    const key = r.no || ('row' + i);
    if(!optGroups.has(key)) optGroups.set(key, []);
    optGroups.get(key).push({
      shape: parseOptShape(trs[i].querySelector('.l-play')?.value, trs[i].querySelector('.l-o')?.value),
      odds: od
    });
  });
  const os = [...optGroups.values()].map(items => maxConsistentOdds(items));
  let payout = 0;
  if(passes.length){
    for(const k of passes){
      if(os.length < k) continue;
      let p = 0;
      for(const c of kCombinations([...os.keys()], k)) p += c.reduce((a, i) => a * os[i], 1);
      payout += p;
    }
  } else {
    payout = os.reduce((a, s) => a + s, 0);
  }
  if(payout > 0){
    const full = payout * 2 * mult;
    text += ` · 预计中奖(理想剧本,税前) ≈ ${full >= 100 ? full.toFixed(0) : full.toFixed(1)} 元`;
    const ew = $('#nbExpected');
    if(ew && document.activeElement !== ew) ew.value = full.toFixed(2);
  }
  el.textContent = text;
}

/** 复式串关注数：counts 为各场选项数，k 串1 = Σ(任取 k 场的选项数连乘) */
function comboBets(counts, k){
  if(counts.length < k) return 0;
  let total = 0;
  const rec = (start, rem, prod) => {
    if(rem === 0){ total += prod; return; }
    for(let i = start; i <= counts.length - rem; i++) rec(i + 1, rem - 1, prod * counts[i]);
  };
  rec(0, k, 1);
  return total;
}

function kCombinations(arr, k){
  if(k <= 0) return [[]];
  if(arr.length < k) return [];
  const [first, ...rest] = arr;
  return kCombinations(rest, k - 1).map(c => [first, ...c]).concat(kCombinations(rest, k));
}

/** 选项形态：比分 {t:'score',x,y} / 半全场 {t:'hafu',h,f} / 总进球 {t:'goals',n(7=7+)} / 胜平负 {t:'result',r} / 其他 */
function parseOptShape(play, opt){
  const o = String(opt || '').trim();
  if(!o) return null;
  const p = String(play || '').trim();
  let m;
  if(p === '总进球数'){
    m = o.match(/^(\d+)\s*\+?\s*球?$/);
    return m ? { t: 'goals', n: Math.min(7, +m[1]) } : { t: 'other' };
  }
  if(p === '半全场'){
    const s = o.replace(/[^胜平负]/g, '');
    return /^[胜平负]\s*\/?\s*[胜平负]$/.test(o) ? { t: 'hafu', h: s[0], f: s[1] } : { t: 'other' };
  }
  if(p === '比分'){
    m = o.match(/^(\d{1,2})\s*[:比]\s*(\d{1,2})$/);
    return m ? { t: 'score', x: +m[1], y: +m[2] } : { t: 'other' };
  }
  if(p === '胜平负') return /^[胜平负]$/.test(o) ? { t: 'result', r: o } : { t: 'other' };
  // 没选玩法：按内容猜
  if((m = o.match(/^(\d{1,2})\s*[:比]\s*(\d{1,2})$/))) return { t: 'score', x: +m[1], y: +m[2] };
  if(/^[胜平负]\s*\/?\s*[胜平负]$/.test(o)){ const s = o.replace(/[^胜平负]/g, ''); return { t: 'hafu', h: s[0], f: s[1] }; }
  if(/^[胜平负]$/.test(o)) return { t: 'result', r: o };
  if((m = o.match(/^(\d+)\s*\+?\s*球?$/))) return { t: 'goals', n: Math.min(7, +m[1]) };
  return { t: 'other' };
}

function halfRes(a, b){ return a > b ? '胜' : (a < b ? '负' : '平'); }

/** 终场 (x,y) 是否可能由某半场比分 res 达成 */
function halfReachable(x, y, res){
  for(let i = 0; i <= x; i++) for(let j = 0; j <= y; j++) if(halfRes(i, j) === res) return true;
  return false;
}

/** 总进球 n 是否存在满足 pred(主,客) 的终场比分 */
function goalsFullExists(n, pred){
  for(let i = 0; i <= 9; i++) for(let j = 0; j <= 9; j++){
    if((n === 7 ? i + j >= 7 : i + j === n) && pred(i, j)) return true;
  }
  return false;
}

/** 同场两个选项能否在同一个真实赛果下同时命中（同玩法/未知类型一律互斥） */
function optsCompatible(a, b){
  if(!a || !b || a.t === 'other' || b.t === 'other' || a.t === b.t) return false;
  const get = t => (a.t === t ? a : (b.t === t ? b : null));
  const s = get('score'), g = get('goals'), h = get('hafu'), r = get('result');
  if(s && g) return g.n === 7 ? s.x + s.y >= 7 : s.x + s.y === g.n;
  if(s && r) return halfRes(s.x, s.y) === r.r;
  if(s && h) return halfRes(s.x, s.y) === h.f && halfReachable(s.x, s.y, h.h);
  if(g && r) return goalsFullExists(g.n, (i, j) => halfRes(i, j) === r.r);
  if(g && h) return goalsFullExists(g.n, (i, j) => halfRes(i, j) === h.f && halfReachable(i, j, h.h));
  if(h && r) return h.f === r.r;
  return false;
}

/** 同场自洽选项集合的最大赔率和：互斥只能取其一，兼容可叠加（2:1+胜胜=17.2） */
function maxConsistentOdds(items){
  const list = (items || []).filter(x => x && Number.isFinite(x.odds) && x.odds > 0);
  if(!list.length) return 0;
  if(list.length > 10){
    // 选项过多退化为贪心：赔率降序，能与已选全部兼容才收
    let chosen = [];
    for(const it of [...list].sort((a, b) => b.odds - a.odds)){
      if(chosen.every(c => optsCompatible(c.shape, it.shape))) chosen.push(it);
    }
    return chosen.reduce((s, c) => s + c.odds, 0);
  }
  let best = 0;
  for(let mask = 1; mask < (1 << list.length); mask++){
    const chosen = [];
    for(let i = 0; i < list.length; i++) if(mask & (1 << i)) chosen.push(list[i]);
    let ok = true;
    for(let i = 0; i < chosen.length && ok; i++)
      for(let j = i + 1; j < chosen.length; j++)
        if(!optsCompatible(chosen[i].shape, chosen[j].shape)){ ok = false; break; }
    if(!ok) continue;
    const sum = chosen.reduce((s, c) => s + c.odds, 0);
    if(sum > best) best = sum;
  }
  return best;
}

      return { home: parts[0] || null, away: parts[1] || null };
    };
    document.querySelectorAll('#nbLines tr').forEach(tr => {
      const matchNo = lineVal(tr, '.l-no').trim();
      const { home, away } = parseVs(lineVal(tr, '.l-vs'));
      const play = tr.querySelector('.l-play').value;
      const option = tr.querySelector('.l-o').value.trim();
      // 有场次号或选项即可；队名可空（后端按场次号补 MatchId）
      if(!home && !away && !matchNo && !option) return;
      const parseOdds = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };
      if(option) playSeen.add(play);
      lines.push({
        matchNo: matchNo || null,
        homeTeam: home, awayTeam: away,
        handicap: null,
        option1: option || null,
        odds1: parseOdds(tr.querySelector('.l-od').value),
        option2: null,
        odds2: null
      });
    });
    if(lines.length === 0){ msg.textContent = '请至少填一场'; return; }
    // 票面玩法：全票同玩法就写明白，混玩法定为「混合过关」（结算按选项形态判）
    let playType;
    if(playSeen.size === 1) playType = PLAY_TO_TICKET[[...playSeen][0]] || '混合过关';
    else if(playSeen.size === 0) playType = $('#nbPlay').value || '混合过关';
    else playType = '混合过关';

    // 购票照片仅存档（不做识别）；编辑时不重传则保留原图
    let ticketPath = _editingPurchase?.ticketImage || null;
    const ticketFile = $('#nbTicketFile').files[0];
    if(ticketFile) ticketPath = await uploadImage(ticketFile);

    const body = {
      board: $('#nbBoard').value,
      expect: ($('#nbExpect') && $('#nbExpect').value.trim()) || null,
      playType,
      passType: $('#nbPass').value.trim() || null,
      multiple: parseInt($('#nbMult').value) || 1,
      betAmount: parseFloat($('#nbAmount').value) || 0,
      expectedWin: parseFloat($('#nbExpected').value) || null,
      buyDate: $('#nbDate').value || new Date().toISOString().slice(0,10),
      status: _editingPurchase?.status || 'WAIT',
      ticketImage: ticketPath,
      lines
    };
    if(_editingPurchase){
      body.purchaseId = _editingPurchase.purchaseId;
      body.actualWin = _editingPurchase.actualWin ?? null;
      body.isHit = _editingPurchase.isHit ?? null;
      body.hitLevel = _editingPurchase.hitLevel ?? null;
      body.resultImage = _editingPurchase.resultImage ?? null;
    }

    const saved = await api('/api/purchase', {method:'POST', body: JSON.stringify(body)});
    if(!saved || saved.purchaseId == null){
      msg.textContent = (saved && saved.message) || '保存失败';
      return;
    }
    if(saved.betCount != null) $('#nbAmount').value = saved.betAmount;
    msg.textContent = saved.betCount != null
      ? `已${_editingPurchase ? '更新' : '保存'} · ${saved.betCount} 注 · ${saved.betAmount} 元`
      : `已${_editingPurchase ? '更新' : '保存'}`;
    _editingPurchase = null;
    loadMybets();
  }catch(e){
    msg.textContent = '保存失败：' + e.message;
  }
}

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtYuan(n){
  const x = Number(n);
  return Number.isFinite(x) ? x.toFixed(1) + '元' : '--';
}
function fmtOdds(n){
  if(n == null || n === '') return '';
  const x = Number(n);
  if(!Number.isFinite(x)) return '';
  const s = x.toFixed(3).replace(/0+$/, '').replace(/\.$/, '');
  return s.includes('.') ? s : s + '.0';
}
function pickHtml(option, odds){
  if(!option) return '';
  const od = fmtOdds(odds);
  return `<div>${esc(option)}${od ? `<span class="od">(${od})</span>` : ''}</div>`;
}
function linePicks(l){
  if(l.option2 || !l.option1 || !/[,，、]/.test(l.option1)){
    return pickHtml(l.option1, l.odds1) + pickHtml(l.option2, l.odds2);
  }
  return l.option1.split(/[,，、]/).map((t,i) => pickHtml(t.trim(), i === 0 ? l.odds1 : null)).join('');
}

const SUMMARY_SPF = {'3':'胜','1':'平','0':'负'};

function localYmd(d){
  const z = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return z.toISOString().slice(0,10);
}
function shiftYmd(ymd, days){
  const [y,m,da] = ymd.split('-').map(Number);
  const dt = new Date(y, m-1, da);
  dt.setDate(dt.getDate()+days);
  return localYmd(dt);
}
function dateQueryHtml(prefix, ymd, withAll){
  const today = localYmd(new Date());
  const nextOff = !ymd || ymd >= today;
  const allBtn = withAll ? `<button type="button" id="${prefix}All" class="${ymd ? '' : 'active'}">全部</button>` : '';
  const ph = withAll && !ymd ? '<span class="date-ph">全部日期</span>' : '';
  return `<div class="date-nav">
    <button type="button" id="${prefix}Prev">前一天</button>
    <label class="date-field"><input type="date" id="${prefix}Date" value="${ymd || ''}" max="${today}" />${ph}</label>
    <button type="button" id="${prefix}Next" ${nextOff ? 'disabled' : ''}>后一天</button>
    ${allBtn}
  </div>`;
}
function bindDateQuery(prefix, getYmd, setYmd, reload){
  const today = localYmd(new Date());
  const prev = document.getElementById(prefix + 'Prev');
  const next = document.getElementById(prefix + 'Next');
  const date = document.getElementById(prefix + 'Date');
  const all = document.getElementById(prefix + 'All');
  if(prev) prev.onclick = () => { setYmd(shiftYmd(getYmd() || today, -1)); reload(); };
  if(next && !next.disabled) next.onclick = () => {
    const n = shiftYmd(getYmd() || today, 1);
    if(n <= today){ setYmd(n); reload(); }
  };
  if(date) date.onchange = () => {
    let v = date.value || '';
    if(v > today) v = today;
    setYmd(v);
    reload();
  };
  if(all) all.onclick = () => { setYmd(''); reload(); };
}

function defaultSummaryDate(){

function ratePill(name, hit, total){

function renderReviewDoc(md){
  const lines = String(md).replace(/\r/g,'').split('\n');
  const sections = [];
  let cur = { title: '', lines: [] };
  for(const line of lines){
    if(line.startsWith('## ')){
      sections.push(cur);
      cur = { title: line.slice(3), lines: [] };
    }else cur.lines.push(line);
  }
  sections.push(cur);
  const open = new Set(['总账','成功','失败','不改的','爆冷观察','大小球（只作参考）']);
  let html = '';
  for(const sec of sections){
    const body = sec.title === '总账' ? reviewTally(sec.lines)
      : sec.title.startsWith('胜负彩') ? reviewSfcSection(sec.lines)
      : reviewLines(sec.lines);
    if(!sec.title){ html += body; continue; }
    html += `<details ${open.has(sec.title) ? 'open' : ''}><summary>${esc(sec.title)}</summary>${body}</details>`;
  }
  return html;
}
function reviewTally(lines){
  const tableLines = lines.filter(l => l.startsWith('|'));
  if(tableLines.length >= 2){
    const rest = lines.filter(l => !l.startsWith('|'));
    return markdownTable(tableLines) + reviewLines(rest);
  }
  const re = /^- (.+?) (\d+) 场，完场 (\d+)，有方向 (\d+) 中 (\d+)，页面会发布 (\d+) 中 (\d+)/;
  const rows = [];
  const rest = [];
  for(const line of lines){
    const m = line.match(re);
    if(!m){ if(line.trim()) rest.push(line); continue; }
    const n = Number(m[2]);
    if(!n) continue;
    rows.push({ name: m[1], n, done: Number(m[3]), aimed: Number(m[4]), hit: Number(m[5]), pub: Number(m[6]), pubHit: Number(m[7]) });
  }
  if(!rows.length) return reviewLines(lines);
  const allDone = rows.every(r => r.done === r.n);
  const rate = (hit, total) => total ? Math.round(100 * hit / total) + '%' : '—';
  const head = ['板块','场次'].concat(allDone ? [] : ['完场']).concat(['有方向','命中','命中率','会发布']);
  const body = rows.map(r => [r.name, r.n].concat(allDone ? [] : [r.done]).concat([
    r.aimed, r.hit, rate(r.hit, r.aimed), r.pub ? `${r.pub} 中 ${r.pubHit}` : '—'
  ]));
  return tallyHtml(head, body) + reviewLines(rest);
}
function markdownTable(lines){
  const rows = lines.map(l => l.split('|').slice(1, -1).map(c => c.trim()))
    .filter(cells => cells.length && !cells.every(c => /^:?-+:?$/.test(c)));
  if(rows.length < 2) return reviewLines(lines);
  return tallyHtml(rows[0], rows.slice(1));
}
function tallyHtml(head, body){
  const th = head.map((c, i) => `<th class="${i ? 'num' : ''}">${esc(c)}</th>`).join('');
  const tr = body.map(row => `<tr>${row.map((c, i) => `<td class="${i ? 'num' : ''}">${esc(c)}</td>`).join('')}</tr>`).join('');
  return `<div class="tally-wrap"><table class="tally"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>`;
}
function reviewSfcSection(lines){
  const issues = [];
  let current = null;
  let match = null;
  const preface = [];
  const flushMatch = () => {
    if(match && current) current.matches.push(match);
    match = null;
  };
  const ensure = (key) => {
    flushMatch();
    if(!current || current.key !== key){
      current = { key, extra: '', matches: [] };
      issues.push(current);
    }
  };
  for(const line of lines){
    const h3 = line.match(/^###\s+(.*)$/);
    const h4 = line.match(/^####\s+(.*)$/);
    const title = h3 ? h3[1] : h4 ? h4[1] : '';
    if(title){
      const issueOnly = title.match(/^(\d{4,6})(?:\s+(.*))?$/);
      const matchNo = title.match(/^(\d{4,6})-(\d+)\b/);
      if(h3 && issueOnly && !matchNo){
        flushMatch();
        ensure(issueOnly[1]);
        current.extra = issueOnly[2] || '';
        continue;
      }
      if(matchNo){
        ensure(matchNo[1]);
        flushMatch();
        match = { title, lines: [] };
        continue;
      }
    }
    if(!current) preface.push(line);
    else if(match) match.lines.push(line);
    else preface.push(line);
  }
  flushMatch();
  issues.sort((a, b) => {
    const opened = (issue) => {
      const head = (issue.extra || '').match(/(\d+)\s*场，完场\s*(\d+)/);
      if(head) return Number(head[1]) > 0 && Number(head[1]) === Number(head[2]);
      return issue.matches.length > 0 && issue.matches.every(m => {
        const verdict = (m.lines.find(l => l.startsWith('- 对照：')) || '').replace('- 对照：', '').trim();
        return verdict && verdict !== '未完场';
      });
    };
    const rank = (key) => { const n = parseInt(key, 10); return Number.isFinite(n) ? n : -1; };
    const byOpen = (opened(a) ? 1 : 0) - (opened(b) ? 1 : 0);
    if(byOpen) return byOpen;
    return rank(b.key) - rank(a.key);
  });
  let html = reviewLines(preface);
  for(const issue of issues){
    const brief = issue.extra || sfcIssueBrief(issue.matches);
    html += `<details class="issue"><summary>第 ${esc(issue.key)} 期${brief ? ' · ' + esc(brief) : ''}</summary>`;
    for(const m of issue.matches){
      html += `<h4>${esc(m.title)}</h4>${reviewLines(m.lines)}`;
    }
    html += '</details>';
  }
  return html;
}
function sfcIssueBrief(matches){
  let done = 0, aimed = 0, hit = 0;
  for(const m of matches){
    const verdict = (m.lines.find(l => l.startsWith('- 对照：')) || '').replace('- 对照：', '').trim();
    if(!verdict || verdict === '未完场') continue;
    done++;
    if(verdict === '命中' || verdict === '未中') aimed++;
    if(verdict === '命中') hit++;
  }
  return `${matches.length} 场，完场 ${done}，有方向 ${aimed} 中 ${hit}`;
}
function reviewLines(lines){
  let html = '';
  let list = false;
  const close = () => { if(list){ html += '</ul>'; list = false; } };
  for(const line of lines){
    if(line.startsWith('# ')){ close(); html += `<h2>${esc(line.slice(2))}</h2>`; }
    else if(line.startsWith('### ')){ close(); html += `<h4>${esc(line.slice(4))}</h4>`; }
    else if(line.startsWith('- ') || line.startsWith('  - ')){
      if(!list){ html += '<ul>'; list = true; }
      const sub = line.startsWith('  ');
      html += `<li${sub ? ' class="sub"' : ''}>${esc(line.replace(/^\s*-\s/,''))}</li>`;
    }else if(!line.trim()) close();
    else { close(); html += `<p>${esc(line)}</p>`; }
  }
  close();
  return html;
}

function renderSummary(d){
  let html = '';
  const finished = (d.items || []).length;
  html += `<div class="page-head">
    ${dateQueryHtml('sum', d.date, false)}
    <span class="meta">${finished ? '库里已完场 ' + finished + ' 场' : '每天 08:20 写前一天'}</span>
  </div>`;

  if(finished > 0){
  const win = d.hitRate >= 50;
  const b = d.boughtStat || {total:0,hit:0,hitRate:0};
  const h = d.highStat || {total:0,hit:0,hitRate:0};
  const bWin = b.hitRate >= 50;
  const hWin = h.hitRate >= 50;
  html += `<div class="bet-stats">
    <div class="stat-card"><div class="s-label">计入命中率</div><div class="s-val ${win?'win':'lose'}">${d.hitRate}%</div><div class="s-sub">置信≥60% · ${d.total} 场 · 中 ${d.hit}${d.hitLow!=null ? ` · 区间 ${d.hitLow}%–${d.hitHigh}%` : ''}</div></div>
    <div class="stat-card"><div class="s-label">实购</div><div class="s-val ${b.total? (bWin?'win':'lose') : ''}">${b.total ? b.hitRate+'%' : '—'}</div><div class="s-sub">${b.hit}/${b.total} 场</div></div>
    <div class="stat-card"><div class="s-label">高置信</div><div class="s-val ${h.total? (hWin?'win':'lose') : ''}">${h.total ? h.hitRate+'%' : '—'}</div><div class="s-sub">≥70% · ${h.hit}/${h.total}</div></div>
  </div>`;

  const pills = [];
  for(const q of d.byQuality || []) pills.push(ratePill(q.name, q.hit, q.total));
  for(const r of d.byResult || []) pills.push(ratePill(r.name, r.hit, r.total));
  if(pills.length) html += `<div class="pill-row">${pills.join('')}</div>`;
  const leagues = (d.byLeague || []).map(l => ratePill(l.league, l.hit, l.total));
  if(leagues.length) html += `<details class="league-fold"><summary>按赛事（${leagues.length}）</summary><div class="pill-row">${leagues.join('')}</div></details>`;
  }

  if(d.document) html += `<div class="review-doc">${renderReviewDoc(d.document)}</div>`;

  // 每场复盘明细：实购场次置顶，其余按比赛时间
  if(!d.items || d.items.length === 0){
    if(!d.document) html += `<div class="empty">${d.date} 的复盘还没写。每天 08:20 写前一天。</div>`;
  } else {
    const sorted = [...d.items].sort((a,b)=>{
      if(a.isBought && !b.isBought) return -1;
      if(!a.isBought && b.isBought) return 1;
      return new Date(a.matchTime) - new Date(b.matchTime);
    });
    for(const it of sorted){
      html += renderSummaryItem(it);
    }
  }

  $('#summary').innerHTML = html;
  bindDateQuery('sum', () => summaryDate, v => { summaryDate = v; }, loadSummary);
}

function oddsPrice(notes, label){
  if(!notes || !label) return '';
  const row = notes.find(x => String(x).split('：')[0] === label);
  return row ? String(row).split('：').slice(1).join('：') : '';
}
function oddsNoteHit(note, it){
  const label = String(note).split('：')[0];
  const full = `${it.fullHome}:${it.fullAway}`;
  if(label.startsWith('最终比分')) return true;
  if(label.startsWith('比分 ')) return label.slice(3).trim() === full;
  if(label.includes('/')) return label === it.halfFull;
  return !!it.hit && label === it.recResultText;
}
function pickMark(hasPick, hit){
  if(!hasPick) return '';
  return hit ? '<span class="hit-tag">命中</span>' : '<span class="miss-tag">未中</span>';
}

function renderSummaryItem(it){
  const tm = it.matchTime ? new Date(it.matchTime).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
  const full = `${it.fullHome}:${it.fullAway}`;
  const half = it.halfHome!=null ? `半场 ${it.halfHome}:${it.halfAway}` : '';
  const cover = it.isCoverAll || !it.recResult;
  const bought = it.boughtOptions && it.boughtOptions.length
    ? it.boughtOptions.map(o=>`<span class="opt-tag">${o}</span>`).join('') : '';
  const confVal = it.confidence==null ? '' : Math.round(it.confidence) + '%';
  const statusClass = cover ? 'st-WAIT' : (it.hit ? 'st-WON' : 'st-LOST');
  const statusText = cover ? '全包' : (it.hit ? '命中' : '未中');
  const scores = [it.recScore1, it.recScore2].filter(Boolean);
  const goalPicks = [it.recGoals1, it.recGoals2].filter(g => g!=null);
  const scoreHit = scores.some(s => s === full);
  const goalHit = goalPicks.some(g => g === it.totalGoals);
  const spfPrice = cover ? '' : oddsPrice(it.oddsNotes, it.recResultText);
  const spfNum = spfPrice ? ` <b class="${it.hit?'hit':''}">${esc(spfPrice)}</b>` : '';
  const bits = [`胜平负 <b>${it.recResultText}</b>${spfNum} → ${it.actualResultText}`];
  if(confVal) bits.push(confVal);
  if(scores.length) bits.push(`比分 ${scores.join('、')} ${pickMark(true, scoreHit)}`);
  if(goalPicks.length) bits.push(`进球 ${goalPicks.join('、')} ${pickMark(true, goalHit)}`);
  if(it.recHandicapText && it.recHandicapText !== '—'){
    const hcpMark = it.handicapHit == null ? '' : (it.handicapHit ? '<span class="hit-tag">命中</span>' : '<span class="miss-tag">未中</span>');
    bits.push(`让球推荐 ${it.recHandicapText} ${hcpMark}`);
  }
  if(it.recHalfFull) bits.push(`半全场推荐 ${it.recHalfFull}`);
  if(it.halfFull){
    const hfPrice = oddsPrice(it.oddsNotes, it.halfFull);
    const hfNum = hfPrice ? ` <b class="hit">${esc(hfPrice)}</b>` : '';
    bits.push(`半全场 ${it.halfFull}${hfNum}`);
  }

  return `<article class="rev ${it.isBought?'is-bought':''}">
    <div>
      <div class="rev-top">
        <span class="badge badge-${it.board}">${BOARD_TEXT[it.board]||it.board}</span>
        <span class="match-no">${it.matchNo||''}</span>
        ${it.isBought ? '<span class="bought-tag">已实购</span>' : ''}
        ${it.confidence!=null && it.confidence<60 ? '<span class="lowconf-tag">低置信</span>' : ''}
        <span class="b-meta">${it.leagueName||''}</span>
        <span class="b-meta">${tm}</span>
      </div>
      <div class="rev-teams">${it.homeTeam} <span class="vs">VS</span> ${it.awayTeam}</div>
      <div class="rev-bits">${bits.join(' · ')}</div>
      ${(it.oddsNotes && it.oddsNotes.length) ? `<div class="rev-odds">赔率 ${it.oddsNotes.map(x => `<b class="${oddsNoteHit(x, it)?'hit':''}">${esc(x)}</b>`).join(' · ')}</div>` : ''}
      ${bought ? `<div class="rev-bits">购买 ${bought}</div>` : ''}
    </div>
    <div class="rev-side">
      <div class="rev-score">${full}</div>
      <div class="rev-half">${half}</div>
      <span class="b-status ${statusClass}">${statusText}</span>
    </div>
    ${it.analysis ? `<details class="rev-note"><summary>推荐思路</summary><p>${it.analysis}</p></details>` : ''}
  </article>`;
}

/* ============ 历史推荐查询 ============ */

const SPF_TEXT = {'3':'胜','1':'平','0':'负'};
function fmtDateTime(t){
  if(!t) return '';
  return new Date(t).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

let historyDate = '';
let _historyData = null;

async function loadHistory(){
  const box = $('#history');
  box.innerHTML = '<div class="empty">加载中…</div>';
  try{
    _historyData = await api('/api/recommend/list?take=2000');
    renderHistory();
  }catch(e){ box.innerHTML = '<div class="empty">加载失败：' + e.message + '</div>'; }
}

function renderHistory(){
  const box = $('#history');
  const d = _historyData;
  const source = (d && d.items) || [];
  const shown = historyDate
    ? source.filter(it => (it.matchTime || it.recDate || '').slice(0,10) === historyDate)
    : source;
  if(source.length === 0){
    box.innerHTML = `<div class="page-head">${dateQueryHtml('his', historyDate, true)}</div><div class="empty">暂无历史推荐记录</div>`;
    bindDateQuery('his', () => historyDate, v => { historyDate = v; }, renderHistory);
    return;
  }

  // 按比赛日期分组（降序），日期内按板块 竞彩/北单/胜负彩 分组
  const byDate = new Map();
  for(const it of shown){
    const day = (it.matchTime || '').slice(0,10) || '日期未知';
    if(!byDate.has(day)) byDate.set(day, []);
    byDate.get(day).push(it);
  }

  // 日期降序排序
  const days = [...byDate.keys()].sort((a,b) => (a < b ? 1 : a > b ? -1 : 0));

  const BOARD_ORDER = ['jc','bd','sfc'];
  const meta = historyDate
    ? `${historyDate} · ${shown.length} 场`
    : `共 ${d.total} 场 · 按比赛日期 → 板块分组`;
  let html = `<div class="page-head">${dateQueryHtml('his', historyDate, true)}<span class="meta">${meta}</span></div>`;
  if(shown.length === 0){
    html += `<div class="empty">${historyDate} 没有推荐记录</div>`;
    box.innerHTML = html;
    bindDateQuery('his', () => historyDate, v => { historyDate = v; }, renderHistory);
    return;
  }

  for(const day of days){
    const items = byDate.get(day);
    // 板块分组，保持 BOARD_ORDER 顺序
    const boards = {};
    for(const it of items){
      const b = BOARD_ORDER.includes(it.board) ? it.board : 'other';
      (boards[b] = boards[b] || []).push(it);
    }

    html += `<div class="history-day">
      <div class="history-day-title">${day}</div>`;

    for(const b of BOARD_ORDER){
      const list = boards[b];
      if(!list || list.length === 0) continue;
      // 竞彩/北单按官方场次号；胜负彩同样按场次号
      list.sort(officialMatchSort);
      const bt = BOARD_TEXT[b] || b;
      const rows = list.map(it => {
        const rr = it.isCoverAll || !it.recResult ? '全包' : (SPF_TEXT[it.recResult] || it.recResult);
        const t = fmtDateTime(it.createdAt);
        const mt = it.matchTime ? fmtDateTime(it.matchTime) : '';
        return `<tr>
          <td class="mono">${mt}</td>
          <td class="mono">${it.matchNo || '—'}</td>
          <td>${it.homeTeam || ''} <span class="vs">vs</span> ${it.awayTeam || ''}</td>
          <td>${rr}</td>
          <td class="mono">${it.confidence != null ? it.confidence.toFixed(1) + '%' : '—'}</td>
          <td class="signal-clip" title="${(it.signalDesc || '').replace(/"/g,'&quot;')}">${it.signalDesc || ''}</td>
        </tr>`;
      }).join('');
      html += `<div class="history-board">
        <div class="history-board-title">${bt} <span class="cnt">${list.length} 场</span></div>
        <div class="tbl"><table>
          <thead><tr><th>比赛时间</th><th>场次</th><th>对阵</th><th>推荐</th><th>置信度</th><th>信号依据</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
      </div>`;
    }

    html += `</div>`;
  }

  box.innerHTML = html;
  bindDateQuery('his', () => historyDate, v => { historyDate = v; }, renderHistory);
}

/* ============ 复盘查询 ============ */

let reviewDate = '';
let _reviewData = null;

async function loadReview(){
  const box = $('#review');
  box.innerHTML = '<div class="empty">加载中…</div>';
  try{
    _reviewData = await api('/api/review/list?take=1000');
    renderReview();
  }catch(e){ box.innerHTML = '<div class="empty">加载失败：' + e.message + '</div>'; }
}

function reviewCounts(it){
  const dir = !it.isCoverAll && (it.recResult === '3' || it.recResult === '1' || it.recResult === '0');
  return dir && it.confidence != null && Number(it.confidence) >= 60;
}

function renderReview(){
  const box = $('#review');
  const d = _reviewData;
  const source = (d && d.items) || [];
  const items = reviewDate
    ? source.filter(it => (it.matchTime || '').slice(0,10) === reviewDate)
    : source;
  if(source.length === 0){
    box.innerHTML = `<div class="page-head">${dateQueryHtml('rev', reviewDate, true)}</div><div class="empty">暂无已复盘的记录</div>`;
    bindDateQuery('rev', () => reviewDate, v => { reviewDate = v; }, renderReview);
    return;
  }
  const order = ['jc','bd','sfc'];
  const groups = {jc:[], bd:[], sfc:[]};
  for(const it of items){
    if(groups[it.board]) groups[it.board].push(it);
  }
  const rowHtml = it => {
    const rr = it.isCoverAll || !it.recResult ? '全包' : (SPF_TEXT[it.recResult] || it.recResult);
    const ar = it.actualResult ? (SPF_TEXT[it.actualResult] || it.actualResult) : '—';
    const mt = it.matchTime ? fmtDateTime(it.matchTime) : '';
    const counted = reviewCounts(it);
    const hit = !counted
      ? '<span class="dim">不计入</span>'
      : it.hit === true ? '<span class="hit-tag">命中</span>' : it.hit === false ? '<span class="miss-tag">未中</span>' : '<span class="dim">待定</span>';
    return `<tr>
      <td class="mono">${mt}</td>
      <td class="mono">${it.matchNo || '—'}</td>
      <td>${it.leagueName || ''}</td>
      <td>${it.homeTeam || ''} <span class="vs">vs</span> ${it.awayTeam || ''}</td>
      <td>${rr}</td>
      <td>${ar}</td>
      <td class="mono">${it.actualScore || '—'}</td>
      <td class="mono">${it.actualGoals != null ? it.actualGoals : '—'}</td>
      <td>${hit}</td>
    </tr>`;
  };
  const sections = order.map(b => {
    const list = groups[b];
    const scored = list.filter(reviewCounts);
    const hitN = scored.filter(it => it.hit === true).length;
    const rate = scored.length ? wilsonText(hitN, scored.length) : null;
    return { b, list, scored: scored.length, hitN, rate };
  });
  const allScored = sections.reduce((n, s) => n + s.scored, 0);
  const allHit = sections.reduce((n, s) => n + s.hitN, 0);
  const allRate = allScored ? wilsonText(allHit, allScored) : '0%';
  const headMeta = items.length === 0
    ? `${reviewDate} 没有已复盘的场次`
    : `计入统计 ${allScored} 场 · 命中 ${allHit} 场 · ${allRate}`;
  let html = `<div class="page-head">${dateQueryHtml('rev', reviewDate, true)}<span class="meta">${headMeta}</span></div>`;
  if(items.length === 0){
    box.innerHTML = html + `<div class="empty">${reviewDate} 没有已复盘的场次</div>`;
    bindDateQuery('rev', () => reviewDate, v => { reviewDate = v; }, renderReview);
    return;
  }
  for(const s of sections){
    const { b, list, hitN, rate } = s;
    const meta = list.length === 0
      ? '暂无已复盘记录'
      : `共 ${list.length} 场 · 计入统计 ${s.scored} 场 · 命中 ${hitN} 场 · ${rate == null ? '—' : rate}`;
    const body = list.length
      ? `<div class="board-scroll"><table class="tbl">
          <thead><tr><th>比赛时间</th><th>场次</th><th>赛事</th><th>对阵</th><th>推荐</th><th>实际</th><th>比分</th><th>进球</th><th>结果</th></tr></thead>
          <tbody>${list.map(rowHtml).join('')}</tbody>
        </table></div>`
      : '<div class="empty">暂无已复盘记录</div>';
    html += `<div class="board">
      <div class="board-head"><span class="badge badge-${b}">${BOARD_TEXT[b]}</span><span class="meta">${meta}</span></div>
      ${body}
    </div>`;
  }
  box.innerHTML = html;
  bindDateQuery('rev', () => reviewDate, v => { reviewDate = v; }, renderReview);
}

/* ---------- 每日跟进（2026-11-06 新口径） ----------
   竞彩每场一注大奶（比分/半全场/总进球三选一），记录抓取时间、水位必发变化、
   重大变化标注，赛后逐场写复盘，每天沉淀一条技能。 */
let followDate = localYmd(new Date());

async function loadDailyFollow(){
  const box = $('#follow');
  box.innerHTML = '<div class="empty">加载中…</div>';
  try{
    const d = await api('/api/daily-follow?date=' + encodeURIComponent(followDate));
    followDate = d.date || followDate;
    renderDailyFollow(d);
  }catch(e){
    box.innerHTML = `<div class="empty">加载失败：${esc(e.message || e)}</div>`;
  }
}

function renderDailyFollow(d){
  const box = $('#follow');
  const playBadge = pt => pt === 'BF' ? '比分' : pt === 'BQ' ? '半全场' : pt === 'JQ' ? '总进球' : pt;
  const playCls = pt => pt === 'BF' ? 'badge-jc' : pt === 'BQ' ? 'badge-bd' : 'badge-sfc';

  let html = `<div class="page-head">${dateQueryHtml('follow', d.date, false)}
    <span class="meta">共 ${d.total} 场 · 结算 ${d.settled} 场 · 命中 ${d.hit} 场 · ${d.hitRate}%</span></div>`;

  // 每日技能总结（若有）
  if(d.skill){
    html += `<div class="board" style="border-left:4px solid #6b4c9a">
      <div class="board-head"><span class="badge" style="background:#6b4c9a">今日技能</span><span class="meta">${esc(d.skill.title)}</span></div>
      <div class="skill-body" style="padding:12px 14px">
        <div style="font-size:14px;line-height:1.6">${esc(d.skill.body)}</div>
        ${d.skill.evidence ? `<div class="dim" style="margin-top:8px;font-size:12px">依据：${esc(d.skill.evidence)}</div>` : ''}
      </div>
    </div>`;
  }

  if(!d.items || d.items.length === 0){
    box.innerHTML = html + `<div class="empty">${d.date} 还没有逐场跟进。等竞彩开赛后每天自动生成。</div>`;
    bindDateQuery('follow', () => followDate, v => { followDate = v; }, loadDailyFollow);
    return;
  }

  const sorted = [...d.items].sort((a,b)=>{
    if(a.settledAt && !b.settledAt) return 1;
    if(!a.settledAt && b.settledAt) return -1;
    return new Date(a.matchTime) - new Date(b.matchTime);
  });

  // 变更历史按 MatchId 建索引，供每场卡片内展示「初判 → 改判」链。
  const changeMap = {};
  for(const c of (d.changes || [])){
    if(!changeMap[c.matchId]) changeMap[c.matchId] = [];
    changeMap[c.matchId].push(c);
  }

  for(const it of sorted){
    const settled = !!it.settledAt;
    const hitTag = !settled ? '<span class="dim">待开赛</span>'
      : it.hit === true ? '<span class="hit-tag">命中</span>'
      : '<span class="miss-tag">未中</span>';
    const major = it.majorChange ? `<div class="major-change" style="margin:4px 0;color:#c0392b;font-size:12px;font-weight:600">⚠ ${esc(it.majorChange)}</div>` : '';
    const water = it.oddsOpenHome != null || it.oddsLastHome != null
      ? `<div class="dim" style="font-size:12px;margin:2px 0">水位 主 ${fmtOdds(it.oddsOpenHome)}→${fmtOdds(it.oddsLastHome)} / 平 ${fmtOdds(it.oddsOpenDraw)}→${fmtOdds(it.oddsLastDraw)} / 客 ${fmtOdds(it.oddsOpenAway)}→${fmtOdds(it.oddsLastAway)} · 必发主 ${fmtPct(it.exRatioOpen)}→${fmtPct(it.exRatioLast)}</div>`
      : '';
    const capture = it.lastCapturedAt ? `<span class="dim">抓取 ${esc(fmtDateTime(it.lastCapturedAt))}</span>` : '';
    const review = settled && it.reviewText
      ? `<div class="review-line" style="margin-top:8px;padding:8px 10px;background:var(--panel2);border-radius:8px;font-size:13px;line-height:1.6">${esc(it.reviewText)}</div>`
      : '';

    // 本场的推荐变更链（初判 → 每次改判）
    let changeHtml = '';
    const chs = changeMap[it.matchId] || [];
    if(chs.length > 0){
      changeHtml = `<div style="margin:6px 0;padding:8px 10px;background:var(--panel2);border-left:3px solid #e67e22;border-radius:6px;font-size:12px;line-height:1.7">`;
      // 第一条变更的 From 即初判
      const first = chs[0];
      changeHtml += `<div style="color:#8a6d3b">📌 初判：<b>${esc(first.fromOptionName || first.fromOptionCode || '—')}</b></div>`;
      for(const c of chs){
        changeHtml += `<div style="margin-top:4px">⏱ ${esc(fmtDateTime(c.changedAt))} · <b>${esc(c.fromOptionName || c.fromOptionCode)}</b> → <b style="color:#c0392b">${esc(c.toOptionName || c.toOptionCode)}</b>${c.triggerSignal ? `<div class="dim">触发：${esc(c.triggerSignal)}</div>` : ''}</div>`;
      }
      changeHtml += `</div>`;
    }

    html += `<div class="board">
      <div class="board-head">
        <span class="badge ${playCls(it.playType)}">${playBadge(it.playType)}</span>
        <span class="meta">${esc(it.matchNo || '')} ${esc(it.leagueName || '')} ${esc(it.homeTeam || '')} vs ${esc(it.awayTeam || '')} ${it.matchTime ? esc(fmtDateTime(it.matchTime)) : ''}</span>
        ${hitTag}
      </div>
      <div style="padding:10px 14px">
        <div style="font-size:15px;font-weight:600">${esc(it.optionName || it.optionCode)} <span class="dim" style="font-weight:400">@ ${it.odds ?? '—'} · 模型概率 ${it.modelProbability ?? '—'}%</span></div>
        ${major}
        ${changeHtml}
        ${water}
        <div class="dim" style="font-size:12px;margin:2px 0">理由：${esc(it.reason || '—')} ${capture}</div>
        ${settled ? `<div style="font-size:13px;margin-top:4px">赛果 <b>${esc(it.actualScore || '—')}</b>${it.actualHalfScore ? '（半场 ' + esc(it.actualHalfScore) + '）' : ''} · 进球 ${it.actualGoals ?? '—'}</div>` : ''}
        ${review}
      </div>
    </div>`;
  }

  box.innerHTML = html;
  bindDateQuery('follow', () => followDate, v => { followDate = v; }, loadDailyFollow);
}

function fmtPct(v){ return v == null ? '—' : Number(v).toFixed(1) + '%'; }

if(token){
  showMain();
  api('/api/auth/me').then(d=>{ $('#nickName').textContent = d.nickName || d.userName; }).catch(()=>{});
  loadRecommendations();
} else { showLogin(); }
